# Every Monday, what Wolfi's index has newer than image/apko.lock.yaml and
# image/initrd/apko.lock.yaml, and which recipes Wolfi's own package passed: task lock:outdated,
# in the job's summary. It changes nothing and blocks nothing. A pin moves only through task lock,
# which resolves with apko and builds both roots, and it needs packages/, which no runner has:
# a version taken from the index alone can need what no other pin satisfies.
name: lock

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Task's own build of the version recipes/task makes, held to its digest, as check installs it.
      - name: Install Task
        run: |
          curl -fsSL -o "$RUNNER_TEMP/task.tar.gz" https://github.com/go-task/task/releases/download/v3.54.0/task_linux_amd64.tar.gz
          echo "680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb  $RUNNER_TEMP/task.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/task.tar.gz" -C /usr/local/bin task

      - name: What Wolfi has newer
        run: task --silent lock:outdated >> "$GITHUB_STEP_SUMMARY"
