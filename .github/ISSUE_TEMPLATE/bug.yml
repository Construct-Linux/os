name: Bug
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: report
    attributes:
      label: construct report
      description: "Run `construct report` in a terminal and paste what it prints. Its journal lines may name your user or networks: read it first."
      render: text
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      placeholder: |
        1.
        2.
        3.
  - type: dropdown
    id: often
    attributes:
      label: How often
      options:
        - Every time
        - Sometimes
        - Once
    validations:
      required: true
