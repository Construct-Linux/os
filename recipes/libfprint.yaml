# libfprint: the fingerprint readers' drivers (Synaptics' and Goodix's match-on-chip readers in
# laptops' power buttons among them), which fprintd serves. Its udev rules and hardware database
# give the person at the seat the reader and let it autosuspend. Wolfi has no recipe.
package:
  name: libfprint
  version: 1.94.100
  epoch: 0
  description: Fingerprint reader drivers
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glib-dev
      # Gio-2.0.gir and the others the bindings include.
      - glib-gir
      - gobject-introspection-dev
      - libgudev-dev
      - libgusb-dev
      - meson
      - ninja
      - openssl-dev
      - pixman-dev
      - systemd-dev

pipeline:
  - uses: fetch
    with:
      uri: https://gitlab.freedesktop.org/libfprint/libfprint/-/archive/v${{package.version}}/libfprint-v${{package.version}}.tar.gz
      expected-sha256: edc90e02f330a7595ceaf37f2c6ec32ed43541347fe936d3273b0bb2524fd19c

  # With introspection: without it, tests/meson.build takes a branch that iterates a dict with one
  # variable, which Meson 1.12 refuses.
  - uses: meson/configure
    with:
      opts: -Ddoc=false -Dinstalled-tests=false -Dgtk-examples=false -Dintrospection=true -Dudev_rules=enabled -Dudev_hwdb=enabled

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: libfprint-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libfprint
