package:
  name: gnome-shell-extension-dash-to-panel
  version: "74"
  epoch: 5
  description: GNOME Shell extension that merges the dash into the top panel
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - gnome-shell

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext
      - glib

pipeline:
  # v74 and upstream master to 803d950 (badge border, top panel size) plus, on the fork's
  # gnome-51 branch: a drag over the panel no longer opens the overview
  # (upstream #2087), Super+I is free unless intellihide is on (#2416), a long left click activates
  # (#2561), a quit app's badge clears (#2560), file modes (#2433), and the extension-version
  # default at the packaged version, so a new account is not told "has been updated".
  - uses: git-checkout
    with:
      repository: https://github.com/Construct-Linux/dash-to-panel
      branch: gnome-51
      expected-commit: 15a568ad67a22666743bd15203ace9ff789b9497

  # A DESTDIR install is the system one: the schema goes to /usr/share/glib-2.0/schemas, compiled
  # with the image, and no gschemas.compiled stays in the extension directory. VERSION keeps the
  # Makefile from calling git for the version.
  - runs: |
      make install DESTDIR=${{targets.destdir}} VERSION=${{package.version}}
