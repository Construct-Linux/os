package:
  name: mozjs140
  version: 140.15.0
  epoch: 0
  description: SpiderMonkey, the Mozilla JavaScript engine (ESR), for gjs
  copyright:
    - license: MPL-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cbindgen
      - clang-${{vars.llvm}}
      - icu-dev
      - libffi-dev
      - lld-${{vars.llvm}}
      - llvm-${{vars.llvm}}
      - llvm-${{vars.llvm}}-dev
      - m4
      - perl
      # python-3.14 removed ast.Str, which the 140 ESR build system still uses.
      - python-3.13
      - rust-1.95
      - zlib-dev

pipeline:
  - uses: fetch
    with:
      uri: https://ftp.mozilla.org/pub/firefox/releases/${{package.version}}esr/source/firefox-${{package.version}}esr.source.tar.xz
      expected-sha256: 358bb03c550f95172f1e31694e4287da3411560df91e931cb25210efdf90e524

  # mozjs-140.pc lacks -DXP_UNIX, which gjs needs for UniquePtrExtensions.h (bug 1973994).
  - uses: patch
    with:
      patches: mozjs140/XP_UNIX.patch

  - runs: |
      cat > .mozconfig <<- END
      ac_add_options --enable-project=js
      mk_add_options MOZ_OBJDIR='${PWD}'/obj
      ac_add_options --prefix=/usr
      ac_add_options --enable-release
      ac_add_options --enable-hardening
      ac_add_options --enable-optimize
      ac_add_options --enable-linker=lld
      ac_add_options --disable-bootstrap
      ac_add_options --disable-debug
      ac_add_options --disable-debug-symbols
      ac_add_options --disable-strip
      # A shared libmozjs must not bring its own allocator into gjs.
      ac_add_options --disable-jemalloc
      ac_add_options --disable-tests
      ac_add_options --with-system-icu
      ac_add_options --with-system-zlib
      ac_add_options --enable-shared-js
      ac_add_options --with-intl-api
      END

      export PATH="/usr/lib/llvm-${{vars.llvm}}/bin:$PATH"
      export CC=clang CXX=clang++
      export SHELL=/bin/sh
      export PYTHON3=/usr/bin/python3.13
      export MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE=system
      export MOZBUILD_STATE_PATH="$PWD/.mozbuild"
      export MOZ_NOSPAM=1
      export LDFLAGS="$LDFLAGS -Wl,-z,stack-size=1048576"

      python3.13 ./mach build

      make -C obj DESTDIR=${{targets.destdir}} install
      rm -f ${{targets.destdir}}/usr/lib/*.ajs

  - uses: strip

vars:
  llvm: "22"

subpackages:
  - name: mozjs140-dev
    pipeline:
      - uses: split/dev
