# Printing, part 2: PPD support, which CUPS 2.4's printers without IPP Everywhere still need
# (and libcupsfilters' universal filter reads).
package:
  name: libppd
  version: 2.1.1
  epoch: 0
  description: "OpenPrinting's PPD library, for printers that still come with a PPD"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext
      - pkgconf
      - cups-dev
      - ghostscript
      - libcupsfilters-dev
      - poppler-utils

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/OpenPrinting/libppd/releases/download/${{package.version}}/libppd-${{package.version}}.tar.xz
      expected-sha256: 3fa341cc03964046d2bf6b161d80c1b4b2e20609f38d860bcaa11cb70c1285e4

  - uses: autoconf/configure
    with:
      opts: --disable-static --disable-mutool --disable-acroread --with-pdftops=pdftops

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
