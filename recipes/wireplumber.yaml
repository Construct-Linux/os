package:
  name: wireplumber
  version: 0.5.18
  epoch: 0
  description: Session and policy manager for PipeWire
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glib-dev
      - lua5.4-dev
      - meson
      - ninja
      - pipewire-dev
      - python3
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/pipewire/wireplumber.git
      tag: ${{package.version}}
      expected-commit: 81606cbb32d29df20147d1b68b662c1082654d81

  # Introspection off: nothing in the session loads the Wp typelib, and its gir is generated
  # from doxygen XML.
  - uses: meson/configure
    with:
      opts: -Dintrospection=disabled -Ddoc=disabled -Dsystem-lua=true -Dsystem-lua-version=5.4 -Delogind=disabled -Dsystemd=enabled -Dsystemd-user-service=true -Dsystemd-system-service=false -Dsystemd-user-unit-dir=/usr/lib/systemd/user -Dtests=false -Ddbus-tests=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: wireplumber-dev
    pipeline:
      - uses: split/dev
