package:
  name: gom
  version: 0.5.6
  epoch: 0
  description: GObject data mapper over SQLite
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gdk-pixbuf-dev
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - meson
      - ninja
      - python-3.13
      - sqlite-dev

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/gom/${{vars.series}}/gom-${{package.version}}.tar.xz
      expected-sha256: 4d7a5e268698c8e7e40603e36e9e3a2b76133931ce1b637c1136301491b54cc3

  # The pygobject override must land in python-3.13's site-packages, so
  # meson's default (relative to its own Python) is kept.
  - uses: meson/configure
    with:
      opts: -Denable-introspection=true -Denable-gtk-doc=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "0.5"

subpackages:
  - name: gom-dev
    pipeline:
      - uses: split/dev
