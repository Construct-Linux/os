package:
  name: colord-gtk
  version: 0.3.1
  epoch: 0
  description: GTK support library for colord
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - colord-dev
      - gettext-dev
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - gtk-4-dev
      - lcms2-dev
      - meson
      - ninja

pipeline:
  - uses: fetch
    with:
      uri: https://www.freedesktop.org/software/colord/releases/colord-gtk-${{package.version}}.tar.xz
      expected-sha256: c176b889b75630a17f4e3d7ef24c09a3e12368e633496087459c8b53ac3a122d

  # gtk3 off: only gnome-control-center links it, through the gtk4 library
  - uses: meson/configure
    with:
      opts: -Dgtk4=true -Dgtk3=false -Dgtk2=false -Dintrospection=true -Dvapi=false -Dtests=false -Dman=false -Ddocs=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: colord-gtk-dev
    pipeline:
      - uses: split/dev
