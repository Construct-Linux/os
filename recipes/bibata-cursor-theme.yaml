package:
  name: bibata-cursor-theme
  version: 2.0.7
  epoch: 3
  description: Bibata Modern cursors in Construct's colours (Bibata-Modern-Construct)
  copyright:
    - license: GPL-3.0-or-later

environment:
  contents:
    packages:
      - busybox
      - python-3.13
      - rsvg-convert

# The fork's gnome-51 branch builds the theme from Bibata's SVGs with one Python program
# (build.py): the X cursors every client reads, and the cursors_scalable/ SVGs GNOME Shell 51
# draws its own cursor from - without them the shell logs "Could not load cursor" and shows
# Adwaita's.
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Construct-Linux/Bibata_Cursor
      branch: gnome-51
      expected-commit: a60da192fb7d1b2d3671447b64bca7683db55a56

  - runs: |
      python3 build.py -o ${{targets.destdir}}/usr/share/icons
      t=${{targets.destdir}}/usr/share/icons/Bibata-Modern-Construct
      test -f $t/index.theme
      test -f $t/cursors/default
      test -f $t/cursors_scalable/default/metadata.json
      chmod -R u=rwX,go=rX ${{targets.destdir}}/usr/share/icons
