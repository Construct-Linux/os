package:
  name: bolt
  version: 0.9.11
  epoch: 1
  description: Thunderbolt 3 device manager
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - glib-dev
      - meson
      - ninja
      - polkit-dev
      # meson runs scripts with #!/bin/bash and #!/usr/bin/python3 at configure time
      - python-3
      - systemd-dev

pipeline:
  - uses: fetch
    with:
      uri: https://gitlab.freedesktop.org/bolt/bolt/-/archive/${{package.version}}/bolt-${{package.version}}.tar.gz
      expected-sha256: cde4fc6d4a188e37d088cf59a5b2d174ac4b03d57bf9d084d711ba92105c33c0

  # The NHI table of bolt's main branch, which knows the controllers released after 0.9.11: a
  # controller missing from it is taken as having no stable uid, with a warning at every boot
  # (Panther Lake's, 0xe433 and 0xe434), and Barlow Ridge's discrete hosts, whose uid is stable,
  # were taken as unstable too.
  - uses: patch
    with:
      patches: bolt/nhi-table-from-master.patch

  - uses: meson/configure
    with:
      opts: -Dman=false -Dinstall-tests=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip
