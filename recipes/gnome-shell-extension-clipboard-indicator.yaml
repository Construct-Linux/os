package:
  name: gnome-shell-extension-clipboard-indicator
  version: "72"
  epoch: 1
  description: Clipboard history manager in the GNOME Shell top bar
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - gnome-shell

environment:
  contents:
    packages:
      - busybox
      - gettext
      - glib

vars:
  uuid: clipboard-indicator@tudmotu.com

pipeline:
  # v72 and upstream master to 60368b1, which takes GNOME 51 and its own fixes for a corrupt or
  # oversize cache (#589, #385), atomic registry writes, and move-to-top after the menu closes.
  # The fork's gnome-51 keeps over it: history written once when idle instead of once per change,
  # clearing on boot once per boot rather than at every unlock (#594's placeholder with it), and
  # Paste pasting the new clipboard (#443). Upstream's history import and export is left out: it
  # refuses the fork's SHA-256-named images, can lose an import to a pending write, and signals
  # the shell through dconf.
  - uses: git-checkout
    with:
      repository: https://github.com/Construct-Linux/gnome-shell-extension-clipboard-indicator
      branch: gnome-51
      expected-commit: 0a286404eb6e1488feb7091edadde7b37e814e1b

  - runs: |
      glib-compile-schemas --strict --dry-run schemas
      ext=${{targets.destdir}}/usr/share/gnome-shell/extensions/${{vars.uuid}}
      install -d "$ext"
      install -m644 *.js metadata.json stylesheet.css "$ext"/
      # The image compiles all schemas at build, so the extension's own
      # gschemas.compiled is left out and getSettings() finds the system one.
      install -Dm644 schemas/*.gschema.xml -t ${{targets.destdir}}/usr/share/glib-2.0/schemas/
      # Without a locale/ beside it the shell reads the extension's catalogue from
      # /usr/share/locale, where split/lang can take it.
      for po in locale/*/LC_MESSAGES/*.po; do
        lang=${po#locale/}; lang=${lang%%/*}
        install -d ${{targets.destdir}}/usr/share/locale/$lang/LC_MESSAGES
        msgfmt "$po" -o ${{targets.destdir}}/usr/share/locale/$lang/LC_MESSAGES/clipboard-indicator.mo
      done
      grep -q '"51"' "$ext"/metadata.json

subpackages:
  - name: gnome-shell-extension-clipboard-indicator-lang
    pipeline:
      - uses: split/locales
