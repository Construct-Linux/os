# fprintd: fingerprint login. GNOME Settings enrols a finger (Users), and GDM, the lock screen and
# sudo take it through pam_fprintd. D-Bus starts it when asked; nothing runs until then. Wolfi has
# no recipe.
package:
  name: fprintd
  version: 1.94.5
  epoch: 0
  description: Fingerprint authentication over D-Bus, and its PAM module
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - dbus-dev
      - glib-dev
      - libfprint-dev
      - linux-pam-dev
      - meson
      - ninja
      - polkit-dev
      - python-3
      - systemd-dev

pipeline:
  - uses: fetch
    with:
      uri: https://gitlab.freedesktop.org/libfprint/fprintd/-/archive/v${{package.version}}/fprintd-v${{package.version}}.tar.gz
      expected-sha256: a026ef34c31b25975275cc29a5e4eba2b54524769672095a5228098a08acd82c

  - uses: meson/configure
    with:
      opts: -Dman=false -Dpam=true -Dsystemd=true -Dpam_modules_dir=/usr/lib/security

  - uses: meson/compile

  - uses: meson/install

  - runs: |
      test -f ${{targets.destdir}}/usr/lib/security/pam_fprintd.so

  - uses: strip

subpackages:
  - name: fprintd-lang
    pipeline:
      - uses: split/locales
    description: fprintd's translations
