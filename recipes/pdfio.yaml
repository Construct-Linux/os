# PDFio, the PDF library libcupsfilters 2.2 reads and writes print jobs with (>= 1.6.4). Wolfi has
# no recipe.
package:
  name: pdfio
  version: 1.6.5
  epoch: 0
  description: A C library for reading and writing PDF files
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - libpng-dev
      - pkgconf
      - zlib-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/michaelrsweet/pdfio/releases/download/v${{package.version}}/pdfio-${{package.version}}.tar.gz
      expected-sha256: 2b9e1db7c4a72cbc896098a6682a1e51fc2bfb979f00bec8bb515ee79c338084

  - uses: autoconf/configure
    with:
      opts: --enable-shared --disable-static --enable-libpng

  - uses: autoconf/make

  - runs: make install DESTDIR=${{targets.destdir}}

  - uses: strip

subpackages:
  - name: pdfio-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - pdfio
