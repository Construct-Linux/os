package:
  name: libgweather4
  version: 4.6.0
  epoch: 0
  description: GNOME weather library
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    runtime:
      - gsettings-desktop-schemas
      - gweather-locations
      - tzdata

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext
      - geocode-glib-dev
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - gweather-locations-dev
      - json-glib-dev
      - libsoup3-dev
      - libxml2-dev
      - meson
      - ninja

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/libgweather/${{vars.series}}/libgweather-${{package.version}}.tar.xz
      expected-sha256: 7f5d0e8c9685ef2ff46c2f3a57cae48d7bf3540b2d83921f889ef28e6a876788

  - uses: meson/configure
    with:
      opts: -Dintrospection=true -Dgtk_doc=false -Denable_vala=false -Dtests=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "4.6"

subpackages:
  - name: libgweather4-dev
    pipeline:
      - uses: split/dev

  - name: libgweather4-lang
    pipeline:
      - uses: split/locales
