package:
  name: libgudev
  version: "238"
  epoch: 0
  description: GObject-based wrapper library for libudev
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - meson
      - ninja
      - systemd-dev

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/libgudev/${{package.version}}/libgudev-${{package.version}}.tar.xz
      expected-sha256: 61266ab1afc9d73dbc60a8b2af73e99d2fdff47d99544d085760e4fa667b5dd1

  # tests need umockdev; no vala consumers in the session
  - uses: meson/configure
    with:
      opts: -Dintrospection=enabled -Dvapi=disabled -Dtests=disabled -Dgtk_doc=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: libgudev-dev
    pipeline:
      - uses: split/dev
