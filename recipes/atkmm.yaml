package:
  name: atkmm
  version: 2.36.4
  epoch: 0
  description: C++ bindings for ATK
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - at-spi2-core-dev
      - build-base
      - busybox
      - glib-dev
      - glibmm-dev
      - libsigcplusplus-dev
      - m4
      - meson
      - ninja
      - perl

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/atkmm/${{vars.series}}/atkmm-${{package.version}}.tar.xz
      expected-sha256: 19cd0758ed752cb89f5bf02247663dfad0926d9351984a20e3c6cf7da62552ac

  - uses: meson/configure
    with:
      opts: -Dbuild-documentation=false -Dmaintainer-mode=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "2.36"

subpackages:
  - name: atkmm-dev
    pipeline:
      - uses: split/dev
      - runs: |
          # atkmmconfig.h and the gmmproc m4 files live in this private dir; only builds need them
          mkdir -p "${{targets.subpkgdir}}"/usr/lib
          for d in "${{targets.destdir}}"/usr/lib/atkmm-*; do
            [ -d "$d" ] || continue
            cp -a "$d" "${{targets.subpkgdir}}"/usr/lib/
            rm -rf "$d"
          done
