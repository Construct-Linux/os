package:
  name: gdm
  version: "51.0"
  epoch: 5
  description: GNOME display manager
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - dbus
      - dconf
      - gnome-session
      - gnome-settings-daemon
      - gnome-shell
      - gsettings-desktop-schemas
      - linux-pam

environment:
  contents:
    packages:
      - accountsservice-dev
      - audit-dev
      - build-base
      - busybox
      - dconf
      - gettext
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - itstool
      - json-glib-dev
      - keyutils-dev
      - libgudev-dev
      - linux-pam-dev
      - meson
      - plymouth-dev
      - ninja
      - polkit-dev
      - systemd-dev

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/gdm/${{vars.series}}/gdm-${{package.version}}.tar.xz
      expected-sha256: 2ce5acf5a438b8f6dc1d14fd777a911be5eeb2f7ab9a7c4600166205b15d6536

  # Wolfi's linux-pam ships base-{auth,account,password,session}, not common-*. And GDM unlocks
  # the login keyring with the password typed (pam_gnome_keyring, as upstream's Fedora and Arch
  # files do), or everything using libsecret - Chrome, GNOME Online Accounts - finds it locked.
  - uses: patch
    with:
      patches: gdm/pam-base.patch

  # A session whose display has not registered 10 s after the session did - a live stick's first
  # boot, every file read cold - makes GDM quit Plymouth without the transition. Hiding the splash
  # activates Plymouth's VT, the login VT, and GDM's VT watch puts a greeter there, in front of the
  # live session (measured: the shell took 11 s, the greeter came at 33 s). The registered session
  # holds its VT, so the timeout quits with the transition, as the display's own registration does.
  - uses: patch
    with:
      patches: gdm/plymouth-timeout-retain-splash.patch

  # Each unlock's reauthentication left its D-Bus connection and server open in the session
  # worker (the interfaces exported on the connection and the connection hold each other): 5
  # file descriptors per unlock, and at 1024 the lock screen shows no prompt until a reboot.
  - uses: patch
    with:
      patches: gdm/session-close-outside-connections.patch

  # x11-support off: gnome-shell 51 runs only as a Wayland compositor. selinux off: it is not in
  # the image. Plymouth on: GDM takes the screen over from the boot splash without a flash.
  - uses: meson/configure
    with:
      opts: -Dsbindir=bin -Dlogind-provider=systemd -Dsystemd-journal=true -Dsystemdsystemunitdir=/usr/lib/systemd/system -Dsystemduserunitdir=/usr/lib/systemd/user -Ddbus-sys=/usr/share/dbus-1/system.d -Ddefault-pam-config=openembedded -Dpam-services-dir=/etc/pam.d -Dlibaudit=enabled -Dselinux=disabled -Dplymouth=enabled -Dx11-support=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "51"

subpackages:
  - name: gdm-dev
    pipeline:
      - uses: split/dev

  - name: gdm-lang
    pipeline:
      - uses: split/locales
