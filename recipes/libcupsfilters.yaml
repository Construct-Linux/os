# Printing, part 1 of OpenPrinting's stack over Wolfi's CUPS (2.4): the library that turns a PDF
# into what a printer takes. Wolfi has CUPS and none of the filters, so a printer added in
# Settings printed nothing. mutool off: Wolfi has no MuPDF; Ghostscript and Poppler do its work.
package:
  name: libcupsfilters
  version: 2.2.1
  epoch: 0
  description: "OpenPrinting's filter library: PDF, raster and image conversion for CUPS"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # The programs its filters run, which no ELF link names.
      - ghostscript
      - poppler-utils

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext
      - pkgconf
      - cups-dev
      - dbus-dev
      - fontconfig-dev
      - freetype-dev
      - ghostscript
      - lcms2-dev
      - pdfio-dev
      - libexif-dev
      - libjpeg-turbo-dev
      - libjxl-dev
      - libpng-dev
      - poppler-dev
      - poppler-utils
      - qpdf-dev
      - tiff-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/OpenPrinting/libcupsfilters/releases/download/${{package.version}}/libcupsfilters-${{package.version}}.tar.xz
      expected-sha256: 0a22b849d5068c4c86b20fbb4192d3faa3dabcc9ee844c8fd73710ed821d4860

  - uses: autoconf/configure
    with:
      opts: --disable-static --enable-dbus --disable-mutool

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
        # Its headers include pdfio.h.
        - pdfio-dev
