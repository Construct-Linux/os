package:
  name: cracklib
  version: 2.10.4
  epoch: 0
  description: Library used to enforce strong passwords
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext
      # cracklib-format calls gzip -cdf on plain text, which busybox gzip rejects.
      - gzip
      - zlib-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/cracklib/cracklib/releases/download/v${{package.version}}/cracklib-${{package.version}}.tar.xz
      expected-sha256: 503573391cfea3e1fca0b7ea0011c887f87f49cf2a97db9a54f92094e604b82b

  # Python bindings off: libpwquality only links the C library. Its messages ("it is based on a
  # dictionary word") reach the person through GNOME's password dialogs, translated.
  - uses: autoconf/configure
    with:
      opts: --disable-static --without-python --sbindir=/usr/bin

  - uses: autoconf/make

  - uses: autoconf/make-install

  # Alpine compiles the dictionary in an apk trigger; here it is compiled once at build time
  # from the bundled cracklib-small list so pw_dict exists without a post-install step.
  - runs: |
      LD_LIBRARY_PATH=${{targets.destdir}}/usr/lib \
        ${{targets.destdir}}/usr/bin/cracklib-format dicts/cracklib-small \
        | LD_LIBRARY_PATH=${{targets.destdir}}/usr/lib ${{targets.destdir}}/usr/bin/cracklib-packer \
          ${{targets.destdir}}/usr/share/cracklib/pw_dict
      test -f ${{targets.destdir}}/usr/share/cracklib/pw_dict.pwd
      rm -rf ${{targets.destdir}}/usr/share/man

  - uses: strip

subpackages:
  - name: cracklib-dev
    pipeline:
      - uses: split/dev

  - name: cracklib-lang
    pipeline:
      - uses: split/locales
