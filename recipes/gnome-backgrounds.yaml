package:
  name: gnome-backgrounds
  version: 51.0.1
  epoch: 0
  description: Default wallpaper set for GNOME
  copyright:
    - license: GPL-2.0-or-later AND CC-BY-2.0 AND CC-BY-SA-2.0 AND CC-BY-SA-3.0
  dependencies:
    runtime:
      # The wallpapers are JPEG XL; Wolfi's glycin-2 ships the jxl loader.
      - glycin-2

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext-dev
      - meson
      - ninja

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/gnome-backgrounds/${{vars.series}}/gnome-backgrounds-${{package.version}}.tar.xz
      expected-sha256: ec50534d7749be0e1503c5504f826c61d1460d2b41cb84518fa6b2f5547d1e1e

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

vars:
  series: "51"
