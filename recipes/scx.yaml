package:
  name: scx
  version: "1.1.3"
  epoch: 0
  description: sched_ext BPF CPU schedulers (scx_lavd, scx_bpfland, scx_cosmos)
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      # scx.service starts the scheduler through /bin/bash.
      - bash

environment:
  contents:
    packages:
      - build-base
      - busybox
      - clang
      - elfutils-dev
      - git
      - libseccomp-dev
      - pkgconf
      - rust
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sched-ext/scx
      tag: v${{package.version}}
      expected-commit: c8728c6b6a3fde451f0f10b95f99aad7a32a750a

  # scx_cosmos is the scheduler services/scx selects by default; the other schedulers and
  # tools (scxtop, scx_layered ...) are not needed on the desktop. scx_loader moved out of
  # this repository and is not part of the release.
  - runs: |
      cargo build --release --locked -p scx_lavd -p scx_bpfland -p scx_cosmos
      for b in scx_lavd scx_bpfland scx_cosmos; do
        install -Dm755 target/release/$b ${{targets.destdir}}/usr/bin/$b
      done
      install -Dm644 services/scx.service ${{targets.destdir}}/usr/lib/systemd/system/scx.service
      install -Dm644 services/scx ${{targets.destdir}}/etc/default/scx
      sed -i 's/^# List of scx_schedulers:.*/# List of scx_schedulers: scx_bpfland scx_cosmos scx_lavd/' ${{targets.destdir}}/etc/default/scx

  - uses: strip
