package:
  name: scx
  version: "1.1.3"
  epoch: 2
  description: sched_ext BPF CPU schedulers (scx_lavd, scx_bpfland, scx_cosmos)
  copyright:
    - license: GPL-2.0-only

environment:
  contents:
    packages:
      - build-base
      - busybox
      - clang
      - elfutils-dev
      - git
      - libseccomp-dev
      - pkgconf
      - rust
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sched-ext/scx
      tag: v${{package.version}}
      expected-commit: c8728c6b6a3fde451f0f10b95f99aad7a32a750a

  # sched-ext/scx 6d31ddd (after 1.1.3; Arch's scx-scheds 1.1.3-2 carries it): lavd routed a task
  # to a CPU outside its cpus_ptr on the REENQ path, and the watchdog ejected the scheduler for a
  # "runnable task stall" every few minutes of ordinary desktop use (sched-ext/scx#3791).
  - uses: patch
    with:
      patches: scx/6d31ddd8-lavd-reenq-cpus-ptr.patch

  # The schedulers scx_loader may switch to (etc/scx_loader.toml starts lavd); the other
  # schedulers and tools (scxtop, scx_layered ...) are not needed on the desktop. scx_loader
  # (recipes/scx-loader) starts the scheduler, so scx's own scx.service and its /etc/default/scx
  # are not installed.
  - runs: |
      cargo build --release --locked -p scx_lavd -p scx_bpfland -p scx_cosmos
      for b in scx_lavd scx_bpfland scx_cosmos; do
        install -Dm755 target/release/$b ${{targets.destdir}}/usr/bin/$b
      done

  - uses: strip
