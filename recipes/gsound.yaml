package:
  name: gsound
  version: 1.0.3
  epoch: 0
  description: Small library for playing system sounds
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - libcanberra-dev
      - meson
      - ninja

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/gsound/${{vars.series}}/gsound-${{package.version}}.tar.xz
      expected-sha256: ca2d039e1ebd148647017a7f548862350bc9af01986d39f10cfdc8e95f07881a

  # gnome-shell loads GSound through gjs, so introspection stays on; vala bindings are not needed.
  - uses: meson/configure
    with:
      opts: -Dintrospection=true -Denable_vala=false -Dgtk_doc=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "1.0"

subpackages:
  - name: gsound-dev
    pipeline:
      - uses: split/dev
