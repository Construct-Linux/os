package:
  name: glib-networking
  version: 2.90.0
  epoch: 0
  description: Networking support for GLib (TLS backend and proxy resolvers)
  copyright:
    - license: LGPL-2.0-or-later
  dependencies:
    runtime:
      - ca-certificates-bundle
      - gsettings-desktop-schemas

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glib-dev
      - gnutls-dev
      - gsettings-desktop-schemas-dev
      - libgcrypt-dev
      - libproxy-dev
      - meson
      - ninja
      - p11-kit-dev

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/glib-networking/${{vars.series}}/glib-networking-${{package.version}}.tar.xz
      expected-sha256: 83a75e3d9c36b66ee86d3281c2fc997816101968a5126ba322b2acb9a74dd8c0

  # GnuTLS is the upstream default backend; OpenSSL would duplicate it. libproxy covers
  # environment proxies, so the separate environment backend is off.
  - uses: meson/configure
    with:
      opts: -Dgnutls=enabled -Dopenssl=disabled -Dlibproxy=enabled -Dgnome_proxy=enabled -Denvironment_proxy=disabled -Dtests=false -Dinstalled_tests=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "2.90"

subpackages:
  - name: glib-networking-lang
    pipeline:
      - uses: split/locales
