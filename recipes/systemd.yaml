# Wolfi's systemd (wolfi-dev/os systemd.yaml, 261.3 epoch 2, with its files in systemd/), built
# with what Wolfi turns off and the desktop needs:
# - TPM2: Wolfi's environment has tpm2-tss but not its headers, so meson leaves it out and
#   systemd-cryptsetup, systemd-cryptenroll and systemd-measure cannot use a TPM - the encrypted
#   /var unlocks with the TPM and the person's PIN, sealed to a signed PCR 11 policy.
# - sysupdate and sysupdated, in their own subpackage: the updates' engine and the D-Bus service
#   GNOME Software updates the OS through.
# - FIDO2: Wolfi builds without libfido2, so systemd-cryptenroll cannot enrol a security key and
#   systemd-cryptsetup has no token to open /var with one (touch and the key's PIN). libfido2 is
#   opened at run time: the root and the initrd install it themselves.
# Everything else is Wolfi's, but for the aarch64-only patch (we build x86_64) and the package
# tests, which use Wolfi's own test pipelines and which melange build does not run.
package:
  name: systemd
  version: "261.3"
  epoch: 6
  description: The systemd System and Service Manager
  copyright:
    - license: LGPL-2.1-or-later AND GPL-2.0-or-later
  resources:
    cpu: 4
    memory: 12Gi
  dependencies:
    runtime:
      - curl
      - dbus
      - kmod
      - libacl1
      - libarchive
      - libaudit
      - libblkid
      - libcrypto3
      - libfdisk
      - libmount
      - libseccomp
      - libselinux
      - libssl3
      - linux-pam
      - merged-lib
      - merged-sbin
      - merged-usrsbin
      - quota-tools
      - so:libcryptsetup.so.12
      - systemd-boot
      - systemd-systemctl
      - wolfi-baselayout

vars:
  llvm-version: 23
  python-version: 3.13

data:
  - name: standalone-binaries
    items:
      "systemd-repart": "systemd-repart.standalone"
      "systemd-sysusers": "systemd-sysusers.standalone"
      "systemd-tmpfiles": "systemd-tmpfiles.standalone"

  - name: filesystems
    items:
      "ext4": "ext4"
      "xfs": "xfs"

environment:
  contents:
    packages:
      - acl-dev
      - audit-dev
      - bpftool
      - build-base
      - ca-certificates-bundle
      - clang-${{vars.llvm-version}}
      - cmake
      - coreutils
      - cryptsetup-dev
      - curl-dev
      - dbus-dev
      - findutils
      - glibc-2.44-dev
      - gnutar
      - gperf
      - kmod
      - kmod-dev
      - libfido2-dev
      - libarchive-dev
      - libbpf
      - libbpf-dev
      - libcap-dev
      - libgcrypt-dev
      - libgpg-error-dev
      - libidn2-dev
      - libmicrohttpd-dev
      - libmount
      - libseccomp-dev
      - libselinux-dev
      - libuuid
      - libxslt
      - linux-headers
      - linux-pam-dev
      - llvm-${{vars.llvm-version}}
      - meson
      - nftables-dev
      - ninja
      - openssf-compiler-options
      - pcre2-dev
      - posix-libc-utils
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-pefile
      - py${{vars.python-version}}-pyelftools
      - python-${{vars.python-version}}
      - quota-tools
      - rsync
      - tpm2-tss
      - tpm2-tss-dev
      - util-linux-dev
      - valgrind-dev
      - xz-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/systemd/systemd
      tag: v${{package.version}}
      expected-commit: 3255daee1572366b74fe92f002a3d60ecbb27103

  - uses: patch
    with:
      patches: |
        systemd/libaudit-comm-limit.patch

  - uses: meson/configure
    with:
      opts: |
        -Dmode=release \
        -Dvmspawn=enabled \
        -Dinstall-tests=true \
        -Dstandalone-binaries=true \
        -Dsplit-bin=false \
        -Ddefault-dnssec=no \
        -Dsysupdate=enabled \
        -Dsysupdated=enabled \
        -Dtpm2=enabled \
        -Dlibfido2=enabled \
        -Dukify=true

  - uses: meson/compile

  - uses: meson/install

  # Strip POSIX ACLs from /var/log/journal{,/remote}. Upstream systemd's
  # tmpfiles.d applies these ACLs at boot (see
  # https://github.com/systemd/systemd/blob/4f397da50592cd79bb8b556595576d5fb0415b81/tmpfiles.d/systemd.conf.in#L28)
  # and pre-seeds them on the shipped directories during meson install;
  # melange then packs them into APKs with SCHILY.xattr.system.posix_acl_
  # {access,default} PAX headers. When apko carries those into an OCI
  # layer, ostree-ext's tar parser (used by bootc install
  # --composefs-backend) can't handle the SCHILY.xattr entries and
  # errors out.
  #
  # tmpfiles + journald reapplies the ACLs on-the-fly at boot / first
  # message write, so removing the pre-baked ACLs is safe. Directory
  # and mode (2755) are preserved. This mirrors how Fedora's systemd
  # RPM ships the dirs (no ACL), since RPM's cpio archive handles
  # xattrs differently and doesn't emit SCHILY.xattr PAX headers.
  #
  # setfacl comes from acl (a runtime dep of acl-dev, which is a
  # build-env dep of this package). If setfacl or the journal dir is
  # ever missing, fail loudly here — silently skipping would ship a
  # broken bootc image that only fails at install-time.
  - runs: |
      setfacl -R -b "${{targets.destdir}}/var/log/journal"

  - uses: strip

subpackages:
  - name: "systemd-test"
    description: "Installable systemd-tests"
    dependencies:
      runtime:
        - merged-sbin
        - systemd
        - systemd-container
        - systemd-journal-gatewayd
        - systemd-journal-remote
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/systemd
          mv ${{targets.destdir}}/usr/lib/systemd/tests ${{targets.subpkgdir}}/usr/lib/systemd
          cd ${{targets.destdir}}

          find . -name '*test*' -print \
          | tar --xattrs '--xattrs-include=*' -pcz '--files-from=-' -f - \
          | tar --xattrs '--xattrs-include=*' -xzf - -C /home/build/melange-out/systemd-test

          find . -name '*test*' -exec rm -f '{}' \;

          mkdir -p ${{targets.subpkgdir}}/usr/lib/systemd/system/
  - range: standalone-binaries
    name: ${{range.key}}-standalone
    description: Standalone version of ${{range.key}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/${{range.value}} ${{targets.subpkgdir}}/usr/bin/${{range.key}}
    dependencies:
      runtime:
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout

  - name: systemd-shutdown-standalone
    description: Standalone version of systemd-shutdown
    # Can't test this with --version because the binary checks the pid before anything else
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/systemd
          mv ${{targets.destdir}}/usr/lib/systemd/systemd-shutdown.standalone ${{targets.subpkgdir}}/usr/lib/systemd/systemd-shutdown
    dependencies:
      runtime:
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
  - name: "systemd-dev"
    description: "headers for systemd"
    dependencies:
      runtime:
        - libudev
        - libudev-dev
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - uses: split/dev
  - name: "libudev"
    description: "udev library"
    dependencies:
      provider-priority: 10
      runtime:
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv ${{targets.destdir}}/usr/lib/libudev.so.* ${{targets.subpkgdir}}/usr/lib
  - name: "libudev-dev"
    description: "udev library development files"
    dependencies:
      provider-priority: 10
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/pkgconfig ${{targets.subpkgdir}}/usr/include
          mv ./melange-out/systemd-dev/usr/include/libudev.h ${{targets.subpkgdir}}/usr/include/
          mv ./melange-out/systemd-dev/usr/lib/pkgconfig/libudev.pc ${{targets.subpkgdir}}/usr/lib/pkgconfig/
          mv ./melange-out/systemd-dev/usr/lib/libudev.so ${{targets.subpkgdir}}/usr/lib/
  - name: "libsystemd"
    description: "systemd library"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv ${{targets.destdir}}/usr/lib/libsystemd.so.* ${{targets.subpkgdir}}/usr/lib
    dependencies:
      runtime:
        - libsystemd-compression-libs
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout

  - name: "libsystemd-shared"
    description: "systemd library"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          cp ${{targets.destdir}}/usr/lib/systemd/libsystemd-shared-*.so  ${{targets.subpkgdir}}/usr/lib/
    dependencies:
      runtime:
        - libsystemd-compression-libs
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout

  - name: libsystemd-compression-libs
    description: "Metapackage for libsystemd compression libraries"
    dependencies:
      runtime:
        - lz4
        - xz
        - zstd

  - name: "systemd-boot-installed"
    description: "systemd bootloader (installed for EFI)"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/boot/EFI/BOOT/
      - if: ${{build.arch}} == 'aarch64'
        runs: |
          cp ${{targets.destdir}}/usr/lib/systemd/boot/efi/systemd-bootaa64.efi ${{targets.subpkgdir}}/boot/EFI/BOOT/BOOTAA64.EFI
      - if: ${{build.arch}} == 'x86_64'
        runs: |
          cp ${{targets.destdir}}/usr/lib/systemd/boot/efi/systemd-bootx64.efi ${{targets.subpkgdir}}/boot/EFI/BOOT/BOOTX64.EFI
    dependencies:
      runtime:
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout

  - name: "systemd-boot"
    description: "systemd bootloader"
    dependencies:
      runtime:
        - libsystemd-shared
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/etc/
          mkdir -p ${{targets.subpkgdir}}/usr/bin/
          mkdir -p ${{targets.subpkgdir}}/usr/lib/kernel/
          mkdir -p ${{targets.subpkgdir}}/usr/lib/systemd/system
          mkdir -p ${{targets.subpkgdir}}/usr/lib/systemd/system-generators/
          mv ${{targets.destdir}}/etc/kernel ${{targets.subpkgdir}}/etc/
          mv ${{targets.destdir}}/usr/bin/kernel-install ${{targets.subpkgdir}}/usr/bin/
          mv ${{targets.destdir}}/usr/bin/bootctl ${{targets.subpkgdir}}/usr/bin/
          mv ${{targets.destdir}}/usr/lib/systemd/system/systemd-boot-update.service ${{targets.subpkgdir}}/usr/lib/systemd/system/
          mv ${{targets.destdir}}/usr/lib/kernel ${{targets.subpkgdir}}/usr/lib/
          mv ${{targets.destdir}}/usr/lib/systemd/boot ${{targets.subpkgdir}}/usr/lib/systemd/
          mv ${{targets.destdir}}/usr/lib/systemd/systemd-bless-boot ${{targets.subpkgdir}}/usr/lib/systemd/
          mv ${{targets.destdir}}/usr/lib/systemd/system/systemd-bless-boot.service ${{targets.subpkgdir}}/usr/lib/systemd/system/
          mv ${{targets.destdir}}/usr/lib/systemd/system-generators/systemd-bless-boot-generator ${{targets.subpkgdir}}/usr/lib/systemd/system-generators/
  - name: "systemd-systemctl"
    description: "systemd systemctl utility"
    dependencies:
      runtime:
        - libsystemd-shared
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin/
          mv ${{targets.destdir}}/usr/bin/systemctl ${{targets.subpkgdir}}/usr/bin/
  - name: systemd-imds
    description: "systemd Instance Metadata Service (IMDS) support"
    dependencies:
      runtime:
        - systemd
    pipeline:
      - runs: |
          cd "${{targets.destdir}}"
          mkdir -p "${{targets.subpkgdir}}/usr/lib/systemd/system-generators"
          mkdir -p "${{targets.subpkgdir}}/usr/lib/systemd/system"
          mkdir -p "${{targets.subpkgdir}}/usr/lib/sysusers.d"
          mkdir -p "${{targets.subpkgdir}}/usr/share/polkit-1/actions"

          # Binaries
          mv usr/lib/systemd/systemd-imds "${{targets.subpkgdir}}/usr/lib/systemd/"
          mv usr/lib/systemd/systemd-imdsd "${{targets.subpkgdir}}/usr/lib/systemd/"
          mv usr/lib/systemd/system-generators/systemd-imds-generator "${{targets.subpkgdir}}/usr/lib/systemd/system-generators/"

          # systemd units
          mv usr/lib/systemd/system/systemd-imdsd@.service "${{targets.subpkgdir}}/usr/lib/systemd/system/"
          mv usr/lib/systemd/system/systemd-imdsd.socket "${{targets.subpkgdir}}/usr/lib/systemd/system/"
          mv usr/lib/systemd/system/systemd-imds-early-network.service "${{targets.subpkgdir}}/usr/lib/systemd/system/"
          mv usr/lib/systemd/system/systemd-imds-import.service "${{targets.subpkgdir}}/usr/lib/systemd/system/"

          # Polkit policy
          mv usr/share/polkit-1/actions/io.systemd.imds.policy "${{targets.subpkgdir}}/usr/share/polkit-1/actions/"

          # sysusers fragment (declares the systemd-imds system user)
          mv usr/lib/sysusers.d/systemd-imds.conf "${{targets.subpkgdir}}/usr/lib/sysusers.d/"
  - name: systemd-container
    description: "systemd container tools"
    dependencies:
      runtime:
        - libarchive
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - systemd
        - wolfi-baselayout
    pipeline:
      - runs: |
          # Move machine, vm/nspawn, import, export and portable components
          cd ${{targets.destdir}}/
          mkdir -p  ${{targets.subpkgdir}}

          find . -name '*machine*' \
          -not -name 'systemd-machine-id*' \
          -not -name 'sysinit.target.wants' \
          -not -name 'sysinit.target.wants' \
          -not -name 'systemd-pcr*.service' \
          -print | tar --xattrs --xattrs-include='*' -pcz --files-from=- -f - \
          | tar --xattrs --xattrs-include='*' -xzf - -C ${{targets.subpkgdir}}

          find . -name '*nspawn*' -print | tar --xattrs --xattrs-include='*' -pcz --files-from=- -f - \
          | tar --xattrs --xattrs-include='*' -xzf - -C ${{targets.subpkgdir}}

          find . -name '*vmspawn*' -print | tar --xattrs --xattrs-include='*' -pcz --files-from=- -f - \
          | tar --xattrs --xattrs-include='*' -xzf - -C ${{targets.subpkgdir}}

          find . -name '*import*' -print | tar --xattrs --xattrs-include='*' -pcz --files-from=- -f - \
          | tar --xattrs --xattrs-include='*' -xzf - -C ${{targets.subpkgdir}}

          find . -name '*export*' -print | tar --xattrs --xattrs-include='*' -pcz --files-from=- -f - \
          | tar --xattrs --xattrs-include='*' -xzf - -C ${{targets.subpkgdir}}

          find . -name '*portable*' -print | tar --xattrs --xattrs-include='*' -pcz --files-from=- -f - \
          | tar --xattrs --xattrs-include='*' -xzf - -C ${{targets.subpkgdir}}


          # Remove those files from the main package
          find . -name '*machine*' -not -name 'systemd-machine-id*' -exec rm -f '{}' \;

          find . -name '*nspawn*' -exec rm -f '{}' \;
          find . -name '*vmspawn*' -exec rm -f '{}' \;
          find . -name '*import*' -exec rm -f '{}' \;
          find . -name '*export*' -exec rm -f '{}' \;
          find . -name '*portable*' -exec rm -f '{}' \;
          find . -name '*portable*' -type d -exec rmdir '{}' \;

          # Misc utilties
          mv usr/lib/systemd/systemd-pull ${{targets.subpkgdir}}/usr/lib/systemd/
          mv usr/bin/systemd-dissect ${{targets.subpkgdir}}/usr/bin/
          mv usr/lib/systemd/system/systemd-loop@.service ${{targets.subpkgdir}}/usr/lib/systemd/system/
  - name: "udev"
    description: "/dev hotplug management daemon"
    dependencies:
      runtime:
        - libsystemd-shared
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          cd ${{targets.destdir}}/
          mkdir -p ${{targets.subpkgdir}}
          find . -name '*udev*' -print | tar --xattrs --xattrs-include='*' -pcz --files-from=- -f - \
          | tar --xattrs --xattrs-include='*' -xzf - -C ${{targets.subpkgdir}}
          find . -name '*systemd-hwdb*' -print | tar --xattrs --xattrs-include='*' -pcz --files-from=- -f - \
          | tar --xattrs --xattrs-include='*' -xzf - -C ${{targets.subpkgdir}}

          find . -name '*udev*' -exec rm -f {} \;
          find . -name '*systemd-hwdb*'  -exec rm -f {} \;
  - name: "systemd-init"
    description: "Configure systemd for use as an init system"
    dependencies:
      runtime:
        - ${{package.name}}
        - agetty
        - kbd
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - mount
        - time-daemon
        - tzdata
        - util-linux-login
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/etc ${{targets.subpkgdir}}/usr/bin
          ln -s ../run/systemd/resolve/stub-resolv.conf "${{targets.subpkgdir}}/etc/resolv.conf"
          echo "uninitialized" > "${{targets.subpkgdir}}/etc/machine-id"
  - name: "systemd-default-network"
    description: "Configure network to DHCP on default interfaces"
    dependencies:
      runtime:
        - ${{package.name}}
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/etc/systemd/network/
          cp systemd/20-eth.network  ${{targets.subpkgdir}}/etc/systemd/network/
          cp systemd/21-enp.network  ${{targets.subpkgdir}}/etc/systemd/network/
          cp systemd/22-end.network  ${{targets.subpkgdir}}/etc/systemd/network/
  - name: "systemd-logind-service"
    description: "Logind service"
    dependencies:
      runtime:
        - ${{package.name}}
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/systemd/system/multi-user.target.wants
          mkdir -p ${{targets.subpkgdir}}/usr/lib/systemd/system/sockets.target.wants
          mv ${{targets.destdir}}/usr/lib/systemd/system/systemd-logind.service ${{targets.subpkgdir}}/usr/lib/systemd/system/
          mv ${{targets.destdir}}/usr/lib/systemd/system/systemd-logind-varlink.socket ${{targets.subpkgdir}}/usr/lib/systemd/system/
          mv ${{targets.destdir}}/usr/lib/systemd/system/dbus-org.freedesktop.login1.service ${{targets.subpkgdir}}/usr/lib/systemd/system/
          mv ${{targets.destdir}}/usr/lib/systemd/system/multi-user.target.wants/systemd-logind.service ${{targets.subpkgdir}}/usr/lib/systemd/system/multi-user.target.wants/
          mv ${{targets.destdir}}/usr/lib/systemd/system/sockets.target.wants/systemd-logind-varlink.socket ${{targets.subpkgdir}}/usr/lib/systemd/system/sockets.target.wants/
          mv ${{targets.destdir}}/usr/lib/systemd/systemd-logind ${{targets.subpkgdir}}/usr/lib/systemd/
  - name: "systemd-logind-stub"
    description: "Fake login service to boot directly into a shell"
    dependencies:
      runtime:
        - ${{package.name}}
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/systemd/system/
          cp ${{targets.destdir}}/usr/lib/systemd/system/serial-getty@.service ${{targets.subpkgdir}}/usr/lib/systemd/system/
          sed -i "s|^ExecStart=.*agetty.*|ExecStart=-/bin/sh -l|" ${{targets.subpkgdir}}/usr/lib/systemd/system/serial-getty@.service
  - name: "systemd-firstboot"
    description: "Initialize basic system settings on or before the first boot-up of a system"
    dependencies:
      runtime:
        - ${{package.name}}
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
        - systemd-homed # systemd-homed-firstboot
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin/
          mkdir -p ${{targets.subpkgdir}}/usr/lib/systemd/system/
          mkdir -p ${{targets.subpkgdir}}/usr/lib/systemd/system/sysinit.target.wants/
          mv ${{targets.destdir}}/usr/bin/systemd-firstboot ${{targets.subpkgdir}}/usr/bin/systemd-firstboot
          mv ${{targets.destdir}}/usr/lib/systemd/system/sysinit.target.wants/systemd-firstboot.service ${{targets.subpkgdir}}/usr/lib/systemd/system/sysinit.target.wants/systemd-firstboot.service
          mv ${{targets.destdir}}/usr/lib/systemd/system/systemd-firstboot.service ${{targets.subpkgdir}}/usr/lib/systemd/system/systemd-firstboot.service
          mv ${{targets.destdir}}/usr/lib/systemd/system/systemd-homed-firstboot.service ${{targets.subpkgdir}}/usr/lib/systemd/system/systemd-homed-firstboot.service
  - range: filesystems
    name: systemd-repart-rootfs-${{range.key}}
    description: "Config file to auto grow root ${{range.key}} filesystem"
    dependencies:
      runtime:
        - ${{package.name}}
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/repart.d/
          cp systemd/50-root-${{range.key}}.conf ${{targets.subpkgdir}}/usr/lib/repart.d/50-root.conf
  - name: "systemd-homed"
    description: "systemd-homed is a system service designed to manage home directories"
    dependencies:
      runtime:
        - ${{package.name}}
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          cd ${{targets.destdir}}/
          mkdir -p ${{targets.subpkgdir}}/etc/systemd
          mkdir -p ${{targets.subpkgdir}}/usr/lib/systemd/system
          mkdir -p ${{targets.subpkgdir}}/usr/bin/
          find . -name '*home*' -print | tar -pcz --files-from=-  -f - | tar --xattrs  --xattrs-include='*' -xzf - -C ${{targets.subpkgdir}}

          find . -name '*home*' -exec rm -f '{}' \;
  - name: "systemd-userdb"
    description: "dynamic user/group manager"
    dependencies:
      runtime:
        - ${{package.name}}
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          cd ${{targets.destdir}}/
          mkdir -p ${{targets.subpkgdir}}/etc/systemd
          mkdir -p ${{targets.subpkgdir}}/usr/lib/systemd/system
          mkdir -p ${{targets.subpkgdir}}/usr/bin/
          find . -name '*userdb*' -print | tar --xattrs --xattrs-include='*' -pcz --files-from=-  -f - | tar --xattrs --xattrs-include='*' -xzf - -C ${{targets.subpkgdir}}
          find . -name '*userdb*' -exec rm -f '{}' \;
  - name: "systemd-ukify"
    description: "tool for creating unified kernel images"
    dependencies:
      runtime:
        - py${{vars.python-version}}-pefile
        - py${{vars.python-version}}-cryptography
        - py${{vars.python-version}}-lz4
        - systemd-boot
    pipeline:
      - runs: |
          for f in usr/bin/ukify usr/lib/systemd/ukify ; do
            mkdir -p "${{targets.subpkgdir}}/${f%/*}"
            mv -v "${{targets.destdir}}/$f" "${{targets.subpkgdir}}/$f"
          done

          # just replace the first line with '#!/usr/bin/python3.XX'
          sed -i -e '1s,.*,#!/usr/bin/python${{vars.python-version}},' \
            "${{targets.subpkgdir}}/usr/bin/ukify"
  - name: systemd-sysupdate
    description: systemd-sysupdate, systemd-sysupdated and updatectl
    dependencies:
      runtime:
        - systemd
        # It writes each transfer by running systemd-import (local sources) or systemd-pull (URL
        # sources), which are in systemd-container.
        - systemd-container
        # systemd-pull checks a URL source's SHA256SUMS.gpg by running gpg.
        - gpg
    pipeline:
      - runs: |
          cd ${{targets.destdir}}
          for f in usr/lib/systemd/systemd-sysupdate usr/bin/systemd-sysupdate usr/lib/systemd/systemd-sysupdated usr/bin/updatectl \
              usr/lib/systemd/system/systemd-sysupdate*.service usr/lib/systemd/system/systemd-sysupdate*.timer \
              usr/lib/systemd/system/dbus-org.freedesktop.sysupdate1.service \
              usr/share/dbus-1/system.d/org.freedesktop.sysupdate1.conf \
              usr/share/dbus-1/system-services/org.freedesktop.sysupdate1.service \
              usr/share/polkit-1/actions/org.freedesktop.sysupdate1.policy; do
            test -e "$f" || test -L "$f" || { echo "missing $f" >&2; exit 1; }
            mkdir -p "${{targets.subpkgdir}}/${f%/*}"
            mv "$f" "${{targets.subpkgdir}}/$f"
          done
  - name: "systemd-journal-gatewayd"
    description: "HTTP server for journal events"
    dependencies:
      runtime:
        - ${{package.name}}
        - gnutls
        - libmicrohttpd
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/lib/systemd/system"
          mv "${{targets.destdir}}/usr/lib/systemd/systemd-journal-gatewayd" "${{targets.subpkgdir}}/usr/lib/systemd/"
          mv "${{targets.destdir}}/usr/lib/systemd/system/systemd-journal-gatewayd.service" "${{targets.subpkgdir}}/usr/lib/systemd/system/"
          mv "${{targets.destdir}}/usr/lib/systemd/system/systemd-journal-gatewayd.socket" "${{targets.subpkgdir}}/usr/lib/systemd/system/"
  - name: "systemd-journal-remote"
    description: "Receive journal messages over the network"
    dependencies:
      runtime:
        - ${{package.name}}
        - gnutls
        - libmicrohttpd
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/lib/systemd/system"
          mv "${{targets.destdir}}/usr/lib/systemd/systemd-journal-remote" "${{targets.subpkgdir}}/usr/lib/systemd/"
          mv "${{targets.destdir}}/usr/lib/systemd/system/systemd-journal-remote.service" "${{targets.subpkgdir}}/usr/lib/systemd/system/"
          mv "${{targets.destdir}}/usr/lib/systemd/system/systemd-journal-remote.socket" "${{targets.subpkgdir}}/usr/lib/systemd/system/"
  - name: "systemd-timesyncd"
    description: "Simple NTP client"
    dependencies:
      provider-priority: 10
      provides:
        - time-daemon
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/systemd"
          mkdir -p "${{targets.subpkgdir}}/usr/lib/systemd/ntp-units.d"
          mkdir -p "${{targets.subpkgdir}}/usr/lib/systemd/system"
          mkdir -p "${{targets.subpkgdir}}/usr/lib/sysusers.d"
          mkdir -p "${{targets.subpkgdir}}/usr/share/dbus-1/system-services"
          mkdir -p "${{targets.subpkgdir}}/usr/share/dbus-1/system.d"
          mkdir -p "${{targets.subpkgdir}}/usr/share/polkit-1/actions"
          mv "${{targets.destdir}}/etc/systemd/timesyncd.conf" "${{targets.subpkgdir}}/etc/systemd/timesyncd.conf"
          mv "${{targets.destdir}}/usr/lib/systemd/systemd-time-wait-sync" "${{targets.subpkgdir}}/usr/lib/systemd/systemd-time-wait-sync"
          mv "${{targets.destdir}}/usr/lib/systemd/systemd-timesyncd" "${{targets.subpkgdir}}/usr/lib/systemd/systemd-timesyncd"
          mv "${{targets.destdir}}/usr/lib/systemd/ntp-units.d/80-systemd-timesync.list" "${{targets.subpkgdir}}/usr/lib/systemd/ntp-units.d/80-systemd-timesync.list"
          mv "${{targets.destdir}}/usr/lib/systemd/system/systemd-time-wait-sync.service" "${{targets.subpkgdir}}/usr/lib/systemd/system/systemd-time-wait-sync.service"
          mv "${{targets.destdir}}/usr/lib/systemd/system/systemd-timesyncd.service" "${{targets.subpkgdir}}/usr/lib/systemd/system/systemd-timesyncd.service"
          mv "${{targets.destdir}}/usr/lib/sysusers.d/systemd-timesync.conf" "${{targets.subpkgdir}}/usr/lib/sysusers.d/systemd-timesync.conf"
          mv "${{targets.destdir}}/usr/share/dbus-1/system-services/org.freedesktop.timesync1.service" "${{targets.subpkgdir}}/usr/share/dbus-1/system-services/org.freedesktop.timesync1.service"
          mv "${{targets.destdir}}/usr/share/dbus-1/system.d/org.freedesktop.timesync1.conf" "${{targets.subpkgdir}}/usr/share/dbus-1/system.d/org.freedesktop.timesync1.conf"
          mv "${{targets.destdir}}/usr/share/polkit-1/actions/org.freedesktop.timesync1.policy" "${{targets.subpkgdir}}/usr/share/polkit-1/actions/org.freedesktop.timesync1.policy"
