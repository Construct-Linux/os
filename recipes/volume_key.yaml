package:
  name: volume_key
  version: 0.3.12
  epoch: 3
  description: Library for manipulating storage volume encryption keys
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      # NSS and NSPR have unversioned sonames (libnss3.so), from which melange derives no dependency: libvolume_key and the volume_key tool link NSS and NSPR.
      - libnss
      - libnspr


environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - cryptsetup-dev
      - gettext-dev
      - glib-dev
      - gpgme-dev
      - libtool
      - libnss-dev
      - pkgconf-dev
      - util-linux-dev

pipeline:
  # releases.pagure.org answers 404 now that Pagure is shut down: Fedora's lookaside cache keeps
  # the same tarball, under its SHA512 (rpms/volume_key, sources).
  - uses: fetch
    with:
      uri: https://src.fedoraproject.org/repo/pkgs/volume_key/volume_key-${{package.version}}.tar.xz/sha512/d056154c9b9d23e4eb661946dd59ed97e116903a3afcff9d9e29258408082f33dcbb69958724143f6bf191a3da488a03b6c02af287790990ed6459e29d66553c/volume_key-${{package.version}}.tar.xz
      expected-sha256: 6ca3748fc1dad22c450bbf6601d4e706cb11c5e662d11bb4aeb473a9cd77309b

  - runs: autoreconf -vif

  # The Python bindings need SWIG and nothing in the desktop imports them.
  - uses: autoconf/configure
    with:
      opts: --without-python --without-python3

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: volume_key-dev
    pipeline:
      - uses: split/dev
