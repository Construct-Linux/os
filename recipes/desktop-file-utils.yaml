package:
  name: desktop-file-utils
  version: "0.28"
  epoch: 0
  description: Command line utilities for working with desktop entries
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glib-dev
      - meson
      - ninja

pipeline:
  - uses: fetch
    with:
      uri: https://www.freedesktop.org/software/desktop-file-utils/releases/desktop-file-utils-${{package.version}}.tar.xz
      expected-sha256: 4401d4e231d842c2de8242395a74a395ca468cd96f5f610d822df33594898a70

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  # The build has no switch for man pages or the Emacs mode; neither belongs on the image.
  - runs: |
      rm -rf ${{targets.destdir}}/usr/share/man ${{targets.destdir}}/usr/share/emacs

  - uses: strip
