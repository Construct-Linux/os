package:
  name: libpwquality
  version: 1.4.5
  epoch: 1
  description: Password quality checking library
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cracklib-dev
      - gettext
      - linux-pam-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/libpwquality/libpwquality/releases/download/libpwquality-${{package.version}}/libpwquality-${{package.version}}.tar.bz2
      expected-sha256: 6fcf18b75d305d99d04d2e42982ed5b787a081af2842220ed63287a2d6a10988

  # Python bindings off: accountsservice and gnome-control-center only link the C library. Its
  # verdicts on a new password are shown to the person, translated (libpwquality-lang).
  - uses: autoconf/configure
    with:
      opts: --disable-static --disable-python-bindings --enable-pam --with-securedir=/usr/lib/security

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      rm -rf ${{targets.destdir}}/usr/share/man

  - uses: strip

subpackages:
  - name: libpwquality-dev
    pipeline:
      - uses: split/dev

  - name: libpwquality-lang
    pipeline:
      - uses: split/locales
