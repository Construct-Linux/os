package:
  name: systemd-sysupdate
  version: "261.3"
  epoch: 1
  description: systemd-sysupdate, systemd-sysupdated and updatectl, standalone, for the systemd Wolfi builds without them
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    runtime:
      # It writes each transfer by running systemd-import (local sources) or systemd-pull (URL
      # sources), which Wolfi ships in systemd-container.
      - systemd-container
      # systemd-pull checks a URL source's SHA256SUMS.gpg by running gpg.
      - gpg

