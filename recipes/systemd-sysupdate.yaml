pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/systemd/systemd
      tag: v${{package.version}}
      expected-commit: 3255daee1572366b74fe92f002a3d60ecbb27103

  # libaudit-comm-limit.patch is Wolfi's (wolfi-dev/os systemd/), kept so the tree is the one
  # Wolfi's systemd is built from; standalone.patch adds the target built below.
  - uses: patch
    with:
      patches: systemd-sysupdate/libaudit-comm-limit.patch systemd-sysupdate/standalone.patch

  # Wolfi's options, with sysupdate on (Wolfi turns it off) and the standalone binaries, which
  # link systemd's own libraries statically: the binary does not depend on the exact build of
  # Wolfi's libsystemd-shared.
  - uses: meson/configure
    with:
      opts: -Dmode=release -Dvmspawn=enabled -Dinstall-tests=false -Dstandalone-binaries=true -Dsplit-bin=false -Ddefault-dnssec=no -Dsysupdate=enabled -Dsysupdated=enabled -Dukify=true -Dman=disabled -Dhtml=disabled -Dtests=false

  # Only these binaries, and the unit meson makes from its template: the rest of systemd is
  # Wolfi's.
  - runs: meson compile -C output systemd-sysupdate.standalone systemd-sysupdated.standalone updatectl.standalone units/systemd-sysupdated.service

  # The units are plain files, installed as meson would and not enabled.
  - runs: |
      install -Dm755 output/systemd-sysupdate.standalone ${{targets.destdir}}/usr/lib/systemd/systemd-sysupdate
      install -Dm755 output/systemd-sysupdated.standalone ${{targets.destdir}}/usr/lib/systemd/systemd-sysupdated
      install -Dm755 output/updatectl.standalone ${{targets.destdir}}/usr/bin/updatectl
      for u in systemd-sysupdate.service systemd-sysupdate.timer systemd-sysupdate-reboot.service systemd-sysupdate-reboot.timer; do
        install -Dm644 units/$u ${{targets.destdir}}/usr/lib/systemd/system/$u
      done
      install -Dm644 output/units/systemd-sysupdated.service ${{targets.destdir}}/usr/lib/systemd/system/systemd-sysupdated.service
      install -Dm644 src/sysupdate/org.freedesktop.sysupdate1.conf ${{targets.destdir}}/usr/share/dbus-1/system.d/org.freedesktop.sysupdate1.conf
      install -Dm644 src/sysupdate/org.freedesktop.sysupdate1.service ${{targets.destdir}}/usr/share/dbus-1/system-services/org.freedesktop.sysupdate1.service
      install -Dm644 src/sysupdate/org.freedesktop.sysupdate1.policy ${{targets.destdir}}/usr/share/polkit-1/actions/org.freedesktop.sysupdate1.policy
      for b in usr/lib/systemd/systemd-sysupdate usr/lib/systemd/systemd-sysupdated usr/bin/updatectl; do
        if readelf -d ${{targets.destdir}}/$b | grep -q libsystemd-shared; then
          echo "$b links libsystemd-shared" >&2
          exit 1
        fi
      done
      ${{targets.destdir}}/usr/lib/systemd/systemd-sysupdate --version | grep -q '^systemd 261 '

  - uses: strip
