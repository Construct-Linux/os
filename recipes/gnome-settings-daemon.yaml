package:
  name: gnome-settings-daemon
  version: "51.0"
  epoch: 2
  description: GNOME settings daemon
  copyright:
    - license: GPL-2.0-only AND LGPL-2.1-only

environment:
  contents:
    packages:
      - alsa-lib-dev
      - build-base
      - busybox
      - colord-dev
      - cups-dev
      # plugins/meson-add-wants.sh runs ln --relative, which busybox lacks
      - coreutils
      - fontconfig-dev
      - gcr4-dev
      - geoclue-dev
      - geocode-glib-dev
      - gettext
      - glib-dev
      - gnome-desktop-dev
      - gsettings-desktop-schemas-dev
      - lcms2-dev
      - libcanberra-dev
      - libgudev-dev
      - libgweather4-dev
      - libnotify-dev
      - libwacom-dev
      - libx11-dev
      - libxfixes-dev
      - libxml2-utils
      - meson
      - networkmanager-dev
      - ninja
      - polkit-dev
      - pulseaudio-dev
      - systemd-dev
      - upower-dev

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/gnome-settings-daemon/${{vars.series}}/gnome-settings-daemon-${{package.version}}.tar.xz
      expected-sha256: 7c6249118ddfffc4bb34d6b3edaa86b3ea02a1ad2b7711d79480749906767665

  # Stopping a sharing service the image does not have (rygel, gnome-user-share-webdav) warned at
  # every network change, and accessibility's stopping and disabling orca when the screen reader is
  # off: the plugins' check for NoSuchUnit never matched a message prefixed "Failed to stop ...",
  # and disabling had none. A unit that is not there is stopped, and disabled.
  - uses: patch
    with:
      patches: gnome-settings-daemon/stop-absent-unit-is-done.patch

  # The keyboard plugin unref'd the person's xkb-options without checking there were any, and
  # nobody has set them on a new account: a CRITICAL at every login (g_variant_unref: assertion
  # 'value != NULL' failed), since 48 (3a9fce09), still on main.
  - uses: patch
    with:
      patches: gnome-settings-daemon/keyboard-options-unset.patch

  # wwan off: needs ModemManager, which is not shipped
  # usb-protection off: it drives USBGuard, which is not shipped, and asked for it at every
  # resume ("The name org.usbguard1 was not provided").
  - uses: meson/configure
    with:
      opts: -Dsystemd=true -Dsystemd-units=true -Delogind=false -Dcups=true -Dwwan=false -Dgcr3=false -Dcolord=true -Dnetwork_manager=true -Dsmartcard=true -Dxwayland=true -Dusb-protection=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "51"

subpackages:
  - name: gnome-settings-daemon-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - gnome-settings-daemon

