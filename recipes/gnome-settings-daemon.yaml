package:
  name: gnome-settings-daemon
  version: "51.0"
  epoch: 0
  description: GNOME settings daemon
  copyright:
    - license: GPL-2.0-only AND LGPL-2.1-only

environment:
  contents:
    packages:
      - alsa-lib-dev
      - build-base
      - busybox
      - colord-dev
      # plugins/meson-add-wants.sh runs ln --relative, which busybox lacks
      - coreutils
      - fontconfig-dev
      - gcr4-dev
      - geoclue-dev
      - geocode-glib-dev
      - gettext
      - glib-dev
      - gnome-desktop-dev
      - gsettings-desktop-schemas-dev
      - lcms2-dev
      - libcanberra-dev
      - libgudev-dev
      - libgweather4-dev
      - libnotify-dev
      - libwacom-dev
      - libx11-dev
      - libxfixes-dev
      - libxml2-utils
      - meson
      - networkmanager-dev
      - ninja
      - polkit-dev
      - pulseaudio-dev
      - systemd-dev
      - upower-dev

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/gnome-settings-daemon/${{vars.series}}/gnome-settings-daemon-${{package.version}}.tar.xz
      expected-sha256: 7c6249118ddfffc4bb34d6b3edaa86b3ea02a1ad2b7711d79480749906767665

  # cups off: printer notifications need cups-pk-helper, which is not shipped
  # wwan off: needs ModemManager, which is not shipped
  - uses: meson/configure
    with:
      opts: -Dsystemd=true -Dsystemd-units=true -Delogind=false -Dcups=false -Dwwan=false -Dgcr3=false -Dcolord=true -Dnetwork_manager=true -Dsmartcard=true -Dxwayland=true

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "51"

subpackages:
  - name: gnome-settings-daemon-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - gnome-settings-daemon

