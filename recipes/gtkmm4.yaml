package:
  name: gtkmm4
  version: 4.24.0
  epoch: 0
  description: C++ bindings for GTK 4
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cairomm-1.16-dev
      - gdk-pixbuf-dev
      - glibmm-dev
      - gtk-4-dev
      - libsigcplusplus-dev
      - m4
      - meson
      - ninja
      - pangomm-dev
      - perl

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/gtkmm/${{vars.series}}/gtkmm-${{package.version}}.tar.xz
      expected-sha256: 7fd9cea356e7d3b74bf7d2a51d7e0e6763f3f9f1cddc5e77c8b0b5b7fa9d5e5a

  - uses: meson/configure
    with:
      opts: -Dbuild-documentation=false -Dbuild-demos=false -Dbuild-tests=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "4.24"

subpackages:
  - name: gtkmm4-dev
    # Wolfi's cairomm dev packages ship cairomm-1.16.pc without a pc:cairomm-1.16 provide, so
    # the dependency melange derives from gtkmm-4.0.pc cannot resolve; the deps are listed instead
    options:
      no-depends: true
    dependencies:
      runtime:
        - gtkmm4
        - cairomm-1.16-dev
        - gdk-pixbuf-dev
        - glibmm-dev
        - gtk-4-dev
        - pangomm-dev
    pipeline:
      - uses: split/dev
      - runs: |
          # gtkmmconfig.h and the gmmproc m4 files live in this private dir; only builds need them
          mkdir -p "${{targets.subpkgdir}}"/usr/lib
          for d in "${{targets.destdir}}"/usr/lib/gtkmm-*; do
            [ -d "$d" ] || continue
            cp -a "$d" "${{targets.subpkgdir}}"/usr/lib/
            rm -rf "$d"
          done
