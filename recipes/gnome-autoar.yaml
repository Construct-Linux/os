package:
  name: gnome-autoar
  version: 0.5.2
  epoch: 0
  description: GNOME archive extraction library
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - libarchive-dev
      - meson
      - ninja

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/gnome-autoar/${{vars.series}}/gnome-autoar-${{package.version}}.tar.xz
      expected-sha256: 6c20bd16c87aba15869e56444424481f632ac302989a203e8ce4dcc73dea33a5

  - uses: meson/configure
    with:
      opts: -Dintrospection=enabled -Dvapi=false -Dtests=false -Ddocs=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "0.5"

subpackages:
  - name: gnome-autoar-dev
    pipeline:
      - uses: split/dev
