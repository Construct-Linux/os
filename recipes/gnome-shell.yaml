package:
  name: gnome-shell
  version: "51.0"
  epoch: 3
  description: GNOME Shell, the core user interface of the GNOME desktop
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - accountsservice
      - adwaita-fonts
      - adwaita-icon-theme
      - desktop-file-utils
      - gjs
      - gnome-bluetooth
      - gnome-session
      - gnome-settings-daemon
      - gsettings-desktop-schemas
      - gst-plugins-good
      - gstreamer
      - ibus
      - librsvg
      - mutter
      - networkmanager
      - pipewire
      - tecla
      - upower

environment:
  contents:
    packages:
      - alsa-lib-dev
      - at-spi2-core-dev
      - build-base
      - busybox
      - cairo-dev
      - evolution-data-server-dev
      - gcr4-dev
      - gdk-pixbuf-dev
      - gettext
      - gjs
      - gjs-dev
      - glib-dev
      - glib-gir
      - glycin-2-dev
      - gnome-autoar-dev
      - gnome-bluetooth-dev
      - gnome-desktop-dev
      - gobject-introspection-dev
      - gsettings-desktop-schemas-dev
      - gtk-4-dev
      - ibus-dev
      - json-glib-dev
      - libcanberra-dev
      - libnma-dev
      - librsvg-dev
      - libsecret-dev
      - libsoup3-dev
      - libx11-dev
      - libxext-dev
      - libxfixes-dev
      - libxml2-dev
      - mesa-dev
      - meson
      - mutter-dev
      - networkmanager-dev
      - ninja
      - pango-dev
      - pipewire-dev
      - polkit-dev
      - pulseaudio-dev
      - python-3.13
      - sassc
      - startup-notification-dev
      - systemd-dev
      - tecla

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/gnome-shell/${{vars.series}}/gnome-shell-${{package.version}}.tar.xz
      expected-sha256: 2179bab13af353427065096af8bf3d30da7b86e0c516e5ba86a14998af9575f6

  # The stage under the session's start is the boot's black: firmware, Plymouth and the shell's
  # ground are #000, and GNOME's grey system background would flash between them. The grep fails
  # the build when a release moves the line.
  - runs: |
      sed -i '/^const DEFAULT_BACKGROUND_COLOR /s/red: 40, green: 40, blue: 40,/red: 0, green: 0, blue: 0,/' \
        js/ui/background.js
      grep -q 'red: 0, green: 0, blue: 0, alpha: 255' js/ui/background.js

  # A window mapped while the overview rebuilds its workspaces - the startup animation's end, a
  # monitor change - is added to a workspace actor already destroyed, by an idle nothing cancels:
  # the shell logs "already disposed" and a TypeError at each (seen with the installer, which
  # autostarts 3 s into the live session, on the release builder's slow VM). The idle is cancelled
  # with the workspace.
  # The unlock dialog's prompt finishes without a verification when the shield is deactivated
  # (logind's Unlock, the shield's own deactivate), and cleared its user verifier without
  # cancelling it: GDM kept the conversation, a gdm-password worker and 5 files in the session's
  # worker, until the next prompt replaced it (task test:usb, "unlock leaves nothing open"). The
  # prompt cancels a verification it finishes without.
  - uses: patch
    with:
      patches: |
        gnome-shell/workspace-cancel-pending-adds-on-destroy.patch
        gnome-shell/authprompt-cancel-on-finish.patch

  # portal_helper off: the captive-portal login window is a WebKitGTK browser, not shipped
  - uses: meson/configure
    with:
      opts: -Dsystemd=true -Dnetworkmanager=true -Dcamera_monitor=true -Dextensions_tool=true -Dportal_helper=false -Dman=false -Dgtk_doc=false -Dtests=false -Dextensions-tool:bash_completion=disabled

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "51"

subpackages:
  - name: gnome-shell-lang
    pipeline:
      - uses: split/locales
