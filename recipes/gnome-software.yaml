package:
  name: gnome-software
  version: "51.1"
  epoch: 0
  description: Install and update applications (Flatpak)
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      # The curated and featured app lists the overview shows.
      - gnome-app-list
      - flatpak

environment:
  contents:
    packages:
      - appstream-dev
      - build-base
      - busybox
      - desktop-file-utils
      - flatpak-dev
      - fwupd-dev
      - libglib-testing-dev
      - gdk-pixbuf-dev
      - gettext
      - glib-dev
      - gsettings-desktop-schemas-dev
      - gtk-4-dev
      - itstool
      - json-glib-dev
      - libadwaita-dev
      - libgudev-dev
      - libsoup3-dev
      - libxmlb-dev
      - meson
      - ninja
      - ostree-dev
      - polkit-dev
      # itstool runs under /usr/bin/python3.
      - python-3.13
      - systemd-dev

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/gnome-software/${{vars.series}}/gnome-software-${{package.version}}.tar.xz
      expected-sha256: 6501b1d7e499bfb8009f08efa3339ca6369bc38ee335cc3dfb67da7b2ab71289

  # No plugin here lists distribution upgrades or keeps offline updates: systemd-sysupdate's are
  # updates, applied at the next boot by themselves. Asked for either, the loader answered "no
  # plugin could handle", which gnome-software logged as a warning at every check, and the shell
  # at every logout and restart dialog. That answer is no upgrade, and no offline update prepared.
  - uses: patch
    with:
      patches: gnome-software/no-plugin-is-none.patch

  # A plugin whose setup failed was disabled with its worker thread still running, and never shut
  # down: at every logout, disposing it aborted gnome-software (gs_worker_thread_dispose:
  # assertion failed: (self->worker_thread == NULL)) - appstream's, on a machine with no AppStream
  # data but Flatpak's. A failed setup now shuts the plugin down as it disables it.
  - uses: patch
    with:
      patches: gnome-software/failed-setup-shuts-down.patch

  # Flatpak is the source of apps; fwupd brings firmware updates and systemd-sysupdated
  # (recipes/systemd) the system's own, both shown and installed here. There is no
  # PackageKit, snapd or malcontent on this image. Web apps install into Epiphany, which needs
  # webkitgtk. sysprof is not available.
  - uses: meson/configure
    with:
      opts: -Dflatpak=true -Dpackagekit=false -Dfwupd=true -Dsnap=false -Dmalcontent=false -Dwebapps=false -Dhardcoded_foss_webapps=false -Dhardcoded_proprietary_webapps=false -Dsystemd-sysupdate=true -Deos_updater=false -Drpm_ostree=false -Dmogwai=false -Ddkms=false -Dpolkit=true -Dgudev=true -Dsysprof=disabled -Dtests=false -Dinstalled_tests=false -Dman=false -Dgtk_doc=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "51"

subpackages:
  - name: gnome-software-dev
    pipeline:
      - uses: split/dev

  - name: gnome-software-lang
    pipeline:
      - uses: split/locales
