package:
  name: gnome-shell-extension-appindicator
  version: "66"
  epoch: 6
  description: GNOME Shell extension for AppIndicator, KStatusNotifierItem and legacy tray icons
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - gnome-shell

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext
      - glib-dev
      # meson.build reads the uuid, schema and gettext domain from metadata.json with jq.
      - jq
      - meson
      - ninja

pipeline:
  # v66 and upstream master to fbc758a (Logger.warn, the Custom Icons entries) plus, on the fork's
  # gnome-51 branch: a leaked handler per D-Bus operation (upstream #647),
  # exceptions on detached menu items (#656), a stack trace a second for apps' own Get errors
  # (#581, #551), tray-pos handlers doubling (#641), the bus scan's subprocess killed when
  # cancelled (#310), and upstream PR #679 for duplicate icons (#665): every item keyed by its
  # owner's unique name and its path, so one that registers by a standard SNI name and the
  # startup scan that finds it by its unique name make one icon, not two (Trayscale at login).
  - uses: git-checkout
    with:
      repository: https://github.com/Construct-Linux/gnome-shell-extension-appindicator
      branch: gnome-51
      expected-commit: b32d8c7f4ef51270ac045f809eaed1461b7fc890

  # The fork installs system-wide only and leaves the schemas to the image, which compiles them
  # all at build.
  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

subpackages:
  - name: gnome-shell-extension-appindicator-lang
    pipeline:
      - uses: split/locales
