package:
  name: gnome-shell-extension-appindicator
  version: "66"
  epoch: 2
  description: GNOME Shell extension for AppIndicator, KStatusNotifierItem and legacy tray icons
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - gnome-shell

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext
      - glib-dev
      # meson.build reads the uuid, schema and gettext domain from metadata.json with jq.
      - jq
      - meson
      - ninja

pipeline:
  # v66 and upstream master to 67741e5 (its Logger.warn fix) plus, on the fork's gnome-51
  # branch: a leaked handler per D-Bus operation (upstream #647),
  # exceptions on detached menu items (#656), a stack trace a second for apps' own Get errors
  # (#581, #551), tray-pos handlers doubling (#641), duplicate icons (#665), and the bus scan's
  # subprocess killed when cancelled (#310).
  - uses: git-checkout
    with:
      repository: https://github.com/aledbf/gnome-shell-extension-appindicator
      branch: gnome-51
      expected-commit: 455ad734e04b5e70d1523c574c6887e7a279f011

  # An explicit local_install keeps the prefix /usr whoever runs the build.
  - uses: meson/configure
    with:
      opts: -Dlocal_install=disabled

  - uses: meson/compile

  - uses: meson/install

  # The install script compiles the schema directory; the image compiles all schemas at build, and
  # a gschemas.compiled here would clash with every other package's.
  - runs: |
      rm -f "${{targets.destdir}}"/usr/share/glib-2.0/schemas/gschemas.compiled

subpackages:
  - name: gnome-shell-extension-appindicator-lang
    pipeline:
      - uses: split/locales
