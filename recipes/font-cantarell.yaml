package:
  name: font-cantarell
  version: 0.303.1
  epoch: 0
  description: Humanist sans-serif font designed for on-screen reading
  copyright:
    - license: OFL-1.1 AND Apache-2.0
  dependencies:
    runtime:
      - fontconfig

environment:
  contents:
    packages:
      - build-base
      - busybox
      - meson
      - ninja

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/cantarell-fonts/${{vars.series}}/cantarell-fonts-${{package.version}}.tar.xz
      expected-sha256: f9463a0659c63e57e381fdd753cf1929225395c5b49135989424761830530411

  # useprebuilt: building the fonts needs fontmake/psautohint, not in Wolfi.
  # buildappstream off: the metainfo only serves software centers, which this desktop leaves out.
  - uses: meson/configure
    with:
      opts: -Duseprebuilt=true -Dbuildappstream=false

  - uses: meson/compile

  - uses: meson/install

vars:
  series: "0.303"
