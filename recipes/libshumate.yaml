package:
  name: libshumate
  version: 1.7.0
  epoch: 0
  description: GTK 4 widget to display maps
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - gperf
      - gtk-4-dev
      - json-glib-dev
      - libsoup3-dev
      - meson
      - ninja
      - protobuf-c-dev
      - sqlite-dev

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/libshumate/${{vars.series}}/libshumate-${{package.version}}.tar.xz
      expected-sha256: 3896cc4b6a7bf83141c27df23ce48cdd68467603bc6b764960307cdcbbef80e5

  # The vector renderer is what GNOME Maps draws its default map style with.
  - uses: meson/configure
    with:
      opts: -Dgir=true -Dvapi=false -Dgtk_doc=false -Ddemos=false -Dvector_renderer=true

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "1.7"

subpackages:
  - name: libshumate-dev
    pipeline:
      - uses: split/dev

  - name: libshumate-lang
    pipeline:
      - uses: split/locales
