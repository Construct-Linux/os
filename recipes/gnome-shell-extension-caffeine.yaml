package:
  name: gnome-shell-extension-caffeine
  # Tag v60 lacks GNOME Shell 51 in metadata.json; the pinned master commit adds it.
  version: 60_git20261002
  epoch: 1
  description: GNOME Shell extension that disables the screensaver and auto suspend
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - gnome-shell

environment:
  contents:
    packages:
      - busybox
      - gettext

pipeline:
  # Upstream master at be18b35 plus, on the fork's gnome-51 branch: no idle inhibition while
  # the screen is locked (upstream #366: locked monitors never turned off).
  - uses: git-checkout
    with:
      repository: https://github.com/Construct-Linux/gnome-shell-extension-caffeine
      branch: gnome-51
      expected-commit: ea1dcf7e6531d5f46185aa62ea24505101401c5f

  # Installed by hand instead of the Makefile's gnome-extensions zip: the schema goes system-wide
  # because the image compiles /usr/share/glib-2.0/schemas at build, and the catalogs go to
  # /usr/share/locale (the shell binds the domain there when the extension has no locale/ dir)
  # so split/locales can carry them.
  - runs: |
      uuid=caffeine@patapon.info
      dest="${{targets.destdir}}/usr/share/gnome-shell/extensions/$uuid"
      mkdir -p "$dest" "${{targets.destdir}}/usr/share/glib-2.0/schemas"
      cp -r $uuid/extension.js $uuid/prefs.js $uuid/mprisMediaPlayer2.js $uuid/metadata.json \
        $uuid/preferences $uuid/icons "$dest"/
      install -m644 $uuid/schemas/*.gschema.xml "${{targets.destdir}}/usr/share/glib-2.0/schemas/"
      domain=$(sed -n 's/.*"gettext-domain": *"\([^"]*\)".*/\1/p' $uuid/metadata.json)
      for po in $uuid/locale/*.po; do
        lang=$(basename "$po" .po)
        mkdir -p "${{targets.destdir}}/usr/share/locale/$lang/LC_MESSAGES"
        msgfmt -o "${{targets.destdir}}/usr/share/locale/$lang/LC_MESSAGES/$domain.mo" "$po"
      done

subpackages:
  - name: gnome-shell-extension-caffeine-lang
    pipeline:
      - uses: split/locales
