package:
  name: libdisplay-info
  version: 0.3.0
  epoch: 0
  description: EDID and DisplayID library
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - hwdata-dev
      - hwdata-pnp
      - meson
      - ninja
      - python3

pipeline:
  - uses: fetch
    with:
      uri: https://gitlab.freedesktop.org/emersion/libdisplay-info/-/releases/${{package.version}}/downloads/libdisplay-info-${{package.version}}.tar.xz
      expected-sha256: 6ae77cd937f9cf7d1321d35c116062c4911e8447010a6a713ac4286f7a9d5987

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: libdisplay-info-dev
    pipeline:
      - uses: split/dev

  - name: libdisplay-info-tools
    description: libdisplay-info tools (di-edid-decode)
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr
          mv ${{targets.destdir}}/usr/bin ${{targets.subpkgdir}}/usr/
