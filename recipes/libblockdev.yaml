package:
  name: libblockdev
  version: 3.5.0
  epoch: 0
  description: Library for manipulating block devices
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    runtime:
      # NSS and NSPR have unversioned sonames (libnss3.so), from which melange derives no dependency: the crypto plugin (libbd_crypto) links NSS.
      - libnss
      - libnspr


environment:
  contents:
    packages:
      - build-base
      - busybox
      # configure's header checks call GNU mktemp --tmpdir.
      - coreutils
      - cryptsetup-dev
      - e2fsprogs-dev
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - keyutils-dev
      - kmod-dev
      - libbytesize-dev
      - libnss-dev
      - libnvme-dev
      - lvm2-dev
      - parted-dev
      - systemd-dev
      - util-linux-dev
      - volume_key-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/storaged-project/libblockdev/releases/download/${{package.version}}/libblockdev-${{package.version}}.tar.gz
      expected-sha256: bccd30e6b5d11504de60d9889ff6a2a25b07a4ec8f04070f2387e168301b3e3a

  # udisks needs crypto, fs, loop, mdraid, nvme, part and swap. LVM,
  # btrfs, multipath, NVDIMM and SMART are server/storage-admin features
  # with no user on a one-disk desktop; Python bindings and the CLI tools are
  # only for scripting.
  - uses: autoconf/configure
    with:
      opts: --without-python3 --without-gtk-doc --without-tools --without-s390 --without-btrfs --without-dm --without-lvm --without-lvm_dbus --without-mpath --without-nvdimm --without-smart --without-smartmontools --disable-tests

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: libblockdev-dev
    pipeline:
      - uses: split/dev
