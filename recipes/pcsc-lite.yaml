package:
  name: pcsc-lite
  version: "2.5.3"
  # Replaces Wolfi's pcsc-lite 2.5.3 (epoch 0), whose pcscd units are user units and whose sysusers
  # file is in /usr/sysusers.d, which systemd never reads: a smart card reader or a security key
  # over CCID (a YubiKey's PIV and OATH, an NFC reader) reached no system pcscd. Built as Wolfi's,
  # with system units, systemd's socket activation and directories, and polkit deciding who may
  # use a card (org.debian.pcsc-lite.access_pcsc: the active local session).
  epoch: 1
  description: Middleware to access a smart card using SCard API (PC/SC)
  copyright:
    - license: GPL-3.0-or-later
    - license: MIT
    - license: BSD-3-Clause
    - license: ISC
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - build-base
      - busybox
      - flex-dev
      - meson
      - ninja
      # pod2man, for the manual pages.
      - perl
      - pkgconf
      - polkit-dev
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/LudovicRousseau/PCSC
      tag: ${{package.version}}
      expected-commit: 58de510789550941e6548399e024083f54b8d4f5
      recurse-submodules: true

  - uses: meson/configure
    with:
      opts: |
        -Dpolkit=true \
        -Dsbindir=/usr/bin \
        -Dlibsystemd=true \
        -Dsystemdunit=system

  - uses: meson/compile

  - uses: meson/install

  - runs: |
      test -f ${{targets.destdir}}/usr/lib/systemd/system/pcscd.socket
      test -f ${{targets.destdir}}/usr/lib/sysusers.d/pcscd-sysusers.conf
      test -f ${{targets.destdir}}/usr/share/polkit-1/actions/org.debian.pcsc-lite.policy

  - uses: strip

subpackages:
  - name: pcsc-lite-dev
    description: PC/SC Architecture smartcard middleware (development files)
    dependencies:
      runtime:
        - pcsc-lite
    pipeline:
      - uses: split/dev

  - name: pcsc-lite-doc
    description: pcsc-lite manpages
    pipeline:
      - uses: split/manpages
