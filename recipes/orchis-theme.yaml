package:
  name: orchis-theme
  version: "20260914"
  epoch: 1
  description: Orchis GTK and GNOME Shell theme (blue and teal, light and dark)
  copyright:
    - license: GPL-3.0-only

environment:
  contents:
    packages:
      - bash
      - busybox
      # install.sh finds itself with readlink -m, which busybox lacks.
      - coreutils
      - sassc

pipeline:
  # The gnome-shell-51 branch of a fork, on upstream's master: Shell 51 only, and what 49-51
  # changed in the shell's widgets that upstream's newest stylesheet (48) leaves unstyled.
  - uses: git-checkout
    with:
      repository: https://github.com/aledbf/Orchis-theme
      branch: gnome-shell-51
      expected-commit: e682b297f798affdd13e1bb68b561055f6850473

  # No -l (it links into a home directory; the image links libadwaita per user) and no -g (the
  # login screen keeps GNOME's look).
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/themes
      ./install.sh -d ${{targets.destdir}}/usr/share/themes -t default teal -c light dark -s standard
      test -f ${{targets.destdir}}/usr/share/themes/Orchis-Teal-Dark/gnome-shell/gnome-shell.css

  # Cinnamon, Xfwm4, Metacity and Plank styles serve desktops the image does not ship.
  - runs: |
      cd ${{targets.destdir}}/usr/share/themes
      rm -r Orchis-*-hdpi Orchis-*-xhdpi
      for t in Orchis-*; do rm -r $t/cinnamon $t/xfwm4 $t/metacity-1 $t/plank; done
