# Wolfi's gst-plugins-bad, with the va plugin: GStreamer's VA-API decoders and encoders, which
# Showtime, Snapshot and every GStreamer player use for hardware video (vah264dec, vaav1dec, ...).
# Wolfi builds it without libva, and with SRT, which no desktop app here uses. Epoch above Wolfi's;
# its test pipelines from Wolfi's CI (test/tw/*) are dropped, its own checks kept.
package:
  name: gst-plugins-bad-1.28
  version: "1.28.8"
  epoch: 1
  description: GStreamer streaming media framework bad plug-ins
  copyright:
    - license: LGPL-2.1
  dependencies:
    provides:
      - gst-plugins-bad=${{package.full-version}}
    runtime:
      - gst-plugins-base-${{vars.major-minor-version}}
      - gstreamer-${{vars.major-minor-version}}
  resources:
    cpu: "1"
    memory: 10Gi

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - alsa-lib-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cdparanoia-dev
      - cmake
      - expat-dev
      - gdk-pixbuf
      - glib-dev
      - glib-gir
      - glibc-2.44-dev
      - gobject-introspection-dev
      - graphene-dev
      - gst-plugins-base-${{vars.major-minor-version}}-dev
      - gstreamer-${{vars.major-minor-version}}
      - gstreamer-${{vars.major-minor-version}}-dev
      - gtk-3-dev
      - libdrm-dev
      - libice-dev
      - libogg-dev
      - libsm-dev
      - libtheora-dev
      - libva-dev
      - libvorbis-dev
      - libxv-dev
      - mesa-dev
      - mesa-gbm
      - mesa-glx
      - mesa-libgallium
      - meson
      - openh264-dev # needed for openh264enc plugin
      - opus-dev
      - orc-compiler
      - orc-dev
      - perl
      - python3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GStreamer/gstreamer
      tag: ${{package.version}}
      expected-commit: 1b2a95a1b72787cda146b46df9605b168e5b683b

  - working-directory: subprojects/gst-plugins-bad
    pipeline:
      - uses: meson/configure
        with:
          opts: |
            -Db_lto=true \
            -Dpackage-origin="https://github.com/wolfi-dev" \
            -Dpackage-name="GStreamer bad plug-ins (Wolfi-Linux)" \
            -Dintrospection=enabled \
            -Dsctp=enabled \
            -Dva=enabled \
      - uses: meson/compile
      - uses: meson/install
      - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    dependencies:
      provides:
        - gst-plugins-bad-dev=${{package.full-version}}
      runtime:
        - ${{package.name}}
    pipeline:
      - uses: split/dev
    description: ${{package.name}} dev

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        gst-transcoder-1.0 --help
        playout --help
    - runs: |
        # Verify the OpenH264 encoder plugin is present
        gst-inspect-1.0 openh264enc > /tmp/openh264enc.txt
        grep -F "OpenH264 encoder/decoder plugin" /tmp/openh264enc.txt
    - runs: |
        # The va plugin is what this override is for.
        test -f /usr/lib/gstreamer-1.0/libgstva.so
