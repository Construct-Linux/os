package:
  name: pipewire
  version: "1.6.9"
  # Replaces Wolfi's pipewire 1.6.9 (epoch 0), which lacks the bluez5 and GStreamer plugins.
  epoch: 1
  description: Server and user space API to deal with multimedia pipelines
  copyright:
    - license: MIT

vars:
  # Upstream's module-loading namespace, unchanged across 0.3.x to 1.6.x.
  pipewire-abi: "0.3"

environment:
  contents:
    packages:
      - alsa-lib-dev
      - bluez-dev
      - build-base
      - busybox
      - dbus-dev
      - glib-dev
      - gst-plugins-base-dev
      - gstreamer-dev
      - libsndfile-dev
      - meson
      - ninja
      - opus-dev
      - readline-dev
      - sbc-dev
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/pipewire/pipewire
      tag: ${{package.version}}
      expected-commit: 8fa27cabdc6c0c1350c69c026af5850ef0af1e26

  # Bluetooth codecs: SBC and Opus only; Wolfi has no libldac, libfreeaptx, fdk-aac or liblc3.
  # bluez5-backend-native-mm needs ModemManager, which the desktop does not ship.
  # JACK (both directions), v4l2, libcamera, roc, ffado, vulkan, ffmpeg, avahi, raop, webrtc
  # echo-cancel, lv2, sofa, ebur128, onnx and libpulse tunnels: nothing in the GNOME session uses them.
  # x11 and libcanberra serve only the X11 bell module, which a Wayland session never loads.
  - uses: meson/configure
    with:
      opts: -Dsession-managers=[] -Ddocs=disabled -Dman=disabled -Dtests=disabled -Dinstalled_tests=disabled -Dexamples=disabled -Dgstreamer=enabled -Dgstreamer-device-provider=enabled -Dlibsystemd=enabled -Dlogind=enabled -Dlogind-provider=libsystemd -Dsystemd-system-service=disabled -Dsystemd-user-service=enabled -Dsystemd-user-unit-dir=/usr/lib/systemd/user -Dudev=enabled -Dalsa=enabled -Dpipewire-alsa=enabled -Dpipewire-jack=disabled -Djack=disabled -Djack-devel=false -Dpipewire-v4l2=disabled -Dv4l2=disabled -Dlibcamera=disabled -Dbluez5=enabled -Dbluez5-backend-native-mm=disabled -Dbluez5-backend-ofono=disabled -Dbluez5-backend-hsphfpd=disabled -Dbluez5-codec-aptx=disabled -Dbluez5-codec-ldac=disabled -Dbluez5-codec-ldac-dec=disabled -Dbluez5-codec-aac=disabled -Dbluez5-codec-lc3plus=disabled -Dbluez5-codec-lc3=disabled -Dbluez5-codec-opus=enabled -Dbluez5-codec-g722=disabled -Dbluez5-plc-spandsp=disabled -Dopus=enabled -Dlibusb=disabled -Dvulkan=disabled -Dffmpeg=disabled -Dpw-cat-ffmpeg=disabled -Dsdl2=disabled -Dsndfile=enabled -Dlibmysofa=disabled -Dlibpulse=disabled -Droc=disabled -Davahi=disabled -Decho-cancel-webrtc=disabled -Draop=disabled -Dlv2=disabled -Dx11=disabled -Dx11-xfixes=disabled -Dlibcanberra=disabled -Dflatpak=disabled -Dreadline=enabled -Dselinux=disabled -Dlibffado=disabled -Dsnap=disabled -Debur128=disabled -Dfftw=disabled -Donnxruntime=disabled -Dcompress-offload=disabled -Devl=disabled

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: pipewire-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - pipewire

  # Same split as Wolfi's, so its dependents resolve against this package.
  - name: pipewire-pulse
    description: PulseAudio-compatible replacement server for pipewire
    dependencies:
      runtime:
        - pipewire
    pipeline:
      - runs: |
          set -e
          d=${{targets.destdir}}
          s=${{targets.subpkgdir}}
          abi=pipewire-${{vars.pipewire-abi}}
          mkdir -p "$s/usr/bin" "$s/usr/lib/$abi" "$s/usr/share/pipewire" "$s/usr/lib/systemd/user"
          mv "$d/usr/bin/pipewire-pulse" "$s/usr/bin/"
          mv "$d/usr/lib/$abi/libpipewire-module-protocol-pulse.so" "$s/usr/lib/$abi/"
          mv "$d/usr/share/pipewire/pipewire-pulse.conf" "$s/usr/share/pipewire/"
          if [ -d "$d/usr/share/pipewire/pipewire-pulse.conf.avail" ]; then
            mv "$d/usr/share/pipewire/pipewire-pulse.conf.avail" "$s/usr/share/pipewire/"
          fi
          mv "$d"/usr/lib/systemd/user/pipewire-pulse.* "$s/usr/lib/systemd/user/"
