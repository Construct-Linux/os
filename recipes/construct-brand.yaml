# CONSTRUCT's identity, from its own repository: the boot animation's frames and the order they
# play in (sequence.json), which cmd/image makes the Plymouth theme of (plymouth.go); the logo, as
# the icon theme's construct-logo - os-release's LOGO, GNOME's About page - in color and as
# GNOME's symbolic icon; the installer's tile; and the wallpaper, light and dark, as GNOME's
# Background settings list it. The palette comes as data and as what apps outside GTK read:
# palette.json, flat, for cmd/image (Plymouth's prompt, the harness's checks); Ghostty's Construct
# Dark and Light themes, which `construct theme` seeds a config to; and VS Code's construct-theme,
# a built-in extension, so it is there before any account opens the editor; System Monitor's chart
# colours as dconf defaults (the palette's series). The images and the
# palette's outputs are the ones brand commits and holds to its sources (its task check).
package:
  name: construct-brand
  version: 0_git20261005
  epoch: 4
  description: CONSTRUCT's logo, boot animation, wallpaper and palette
  copyright:
    - license: CC-BY-SA-4.0
  dependencies:
    runtime: []

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Construct-Linux/brand
      branch: ui-hill-climb
      expected-commit: 0989b1f4ef2151355f613ea369caf96391a3a846

  - runs: |
      d=${{targets.destdir}}/usr/share
      mkdir -p $d/construct/plymouth $d/icons/hicolor/scalable/apps $d/icons/hicolor/symbolic/apps \
        $d/backgrounds/construct $d/gnome-background-properties $d/licenses/construct-brand \
        $d/ghostty/themes $d/code/resources/app/extensions/construct-theme/themes
      cp plymouth/frame-*.png plymouth/sequence.json $d/construct/plymouth/
      cp logos/construct.svg $d/icons/hicolor/scalable/apps/construct-logo.svg
      cp logos/construct-symbolic.svg $d/icons/hicolor/symbolic/apps/construct-logo-symbolic.svg
      cp logos/io.github.construct_linux.Installer.svg logos/io.github.construct_linux.Construct.svg $d/icons/hicolor/scalable/apps/
      cp palette/construct.json $d/construct/palette.json
      # bake's dconf update compiles it into the local database with etc/dconf's own.
      install -Dm644 palette/system-monitor.dconf ${{targets.destdir}}/etc/dconf/db/local.d/20-construct-system-monitor
      cp "palette/ghostty/Construct Dark" "palette/ghostty/Construct Light" $d/ghostty/themes/
      # Its themes include VS Code's own 2026 ones for syntax by a path relative to the extensions
      # directory (theme-defaults), so it works only from there.
      cp palette/vscode/package.json $d/code/resources/app/extensions/construct-theme/
      cp palette/vscode/themes/*.json $d/code/resources/app/extensions/construct-theme/themes/
      for s in 16 24 32 48 64; do
        mkdir -p $d/icons/hicolor/${s}x${s}/apps
        cp logos/construct-$s.png $d/icons/hicolor/${s}x${s}/apps/construct-logo.png
      done
      # The default pair and its quieter variants (quiet, offset, mark): construct.xml lists them all.
      cp wallpapers/construct*.png $d/backgrounds/construct/
      test "$(ls $d/backgrounds/construct/*.png | wc -l)" -eq 8
      cp wallpapers/construct.xml $d/gnome-background-properties/construct.xml
      cp LICENSES/CC-BY-SA-4.0.txt LICENSES/OFL-1.1.txt $d/licenses/construct-brand/
