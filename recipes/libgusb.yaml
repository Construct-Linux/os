package:
  name: libgusb
  version: 0.4.9
  epoch: 0
  description: GLib wrapper around libusb
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    runtime:
      # Device names are looked up in the usb.ids file the library is built against.
      - hwdata-usb

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - json-glib-dev
      - libusb-dev
      - meson
      - ninja
      - python3

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/hughsie/libgusb/releases/download/${{package.version}}/libgusb-${{package.version}}.tar.xz
      expected-sha256: 9df5ef301d6a4b361002aa52cce1165a87a89744055879bdbab31e7e86f1e846

  # umockdev only drives the self tests, which are off.
  - uses: meson/configure
    with:
      opts: -Dintrospection=true -Ddocs=false -Dtests=false -Dvapi=false -Dumockdev=disabled -Dusb_ids=/usr/share/hwdata/usb.ids

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: libgusb-dev
    pipeline:
      - uses: split/dev

  - name: libgusb-utils
    description: libgusb command line tool
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr
          mv ${{targets.destdir}}/usr/bin ${{targets.subpkgdir}}/usr/
