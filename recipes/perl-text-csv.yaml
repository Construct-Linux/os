package:
  name: perl-text-csv
  version: "2.06"
  epoch: 0
  description: Manipulate comma-separated value strings
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
  dependencies:
    runtime:
      - perl

environment:
  contents:
    packages:
      - build-base
      - busybox
      - perl

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/I/IS/ISHIGAKI/Text-CSV-${{package.version}}.tar.gz
      expected-sha256: dfcaec925a788b0ba41e51bc6d16e21b0e98b4c7af9b79395090add75f5e506f

  - uses: perl/make

  - runs: make DESTDIR="${{targets.destdir}}" install

  # Man pages are not shipped in this minimal build.
  - runs: rm -rf "${{targets.destdir}}"/usr/share/man

  - uses: perl/cleanup

  - uses: strip
