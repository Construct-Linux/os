package:
  name: glibmm
  version: 2.90.0
  epoch: 0
  description: C++ wrapper for the GLib toolkit
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glib-dev
      - libsigcplusplus-dev
      - m4
      - meson
      - ninja
      - perl

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/glibmm/${{vars.series}}/glibmm-${{package.version}}.tar.xz
      expected-sha256: e2efa45643f16b9fea2d6299f2f403d672eaeacddf0ff7f8094e1af9b0f5980b

  - uses: meson/configure
    with:
      opts: -Dbuild-documentation=false -Dbuild-examples=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "2.90"

subpackages:
  - name: glibmm-dev
    pipeline:
      - uses: split/dev
      - runs: |
          # glibmmconfig.h/giommconfig.h and the gmmproc tools live in these private dirs; only builds need them
          mkdir -p "${{targets.subpkgdir}}"/usr/lib
          for d in "${{targets.destdir}}"/usr/lib/glibmm-* "${{targets.destdir}}"/usr/lib/giomm-*; do
            [ -d "$d" ] || continue
            cp -a "$d" "${{targets.subpkgdir}}"/usr/lib/
            rm -rf "$d"
          done
