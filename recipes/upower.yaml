package:
  name: upower
  version: 1.91.4
  epoch: 0
  description: Power management service
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - libgudev-dev
      - meson
      - ninja
      - polkit-dev
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/upower/upower.git
      tag: v${{package.version}}
      expected-commit: af22b0bb6a97fff89b0e11101de9fc4937832864

  # idevice off: no iPhone battery reporting needed in a VM session
  - uses: meson/configure
    with:
      opts: -Dintrospection=enabled -Dman=false -Dgtk-doc=false -Dinstalled_tests=false -Didevice=disabled -Dpolkit=enabled -Dos_backend=linux -Dsystemdsystemunitdir=/usr/lib/systemd/system -Dudevrulesdir=/usr/lib/udev/rules.d -Dudevhwdbdir=/usr/lib/udev/hwdb.d -Dzshcompletiondir=no

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: upower-dev
    pipeline:
      - uses: split/dev
