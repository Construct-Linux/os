package:
  name: libndp
  version: "1.9"
  epoch: 0
  description: Library for IPv6 Neighbor Discovery Protocol
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - libtool

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/jpirko/libndp/archive/v${{package.version}}.tar.gz
      expected-sha256: e564f5914a6b1b799c3afa64c258824a801c1b79a29e2fe6525b682249c65261

  # autogen.sh needs bash; this is its only command.
  - runs: autoreconf --force --install -I m4

  - uses: autoconf/configure
    with:
      opts: --disable-static

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: libndp-dev
    pipeline:
      - uses: split/dev
