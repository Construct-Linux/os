package:
  name: at-spi2-core
  version: "2.62.0.1"
  # Replaces Wolfi's at-spi2-core 2.62.0.1 (epoch 0), which deletes the systemd user units;
  # gnome-shell activates at-spi-dbus-bus.service.
  epoch: 1
  description: Protocol definitions and daemon for D-Bus at-spi
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - dbus-dev
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - libxml2-dev
      - libxtst-dev
      - meson
      - ninja
      - python3

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.gnome.org/GNOME/at-spi2-core
      tag: ${{package.version}}
      expected-commit: b33ff15213c4c09dfc0a5b261875c65c7cffd91d

  # The image runs dbus-daemon, not dbus-broker, so the a11y bus launches with it.
  - uses: meson/configure
    with:
      opts: -Dx11=enabled -Dintrospection=enabled -Ddocs=false -Duse_systemd=true -Dsystemd_user_dir=/usr/lib/systemd/user -Ddefault_bus=dbus-daemon -Ddbus_daemon=/usr/bin/dbus-daemon

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: at-spi2-core-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - at-spi2-core
        - libxext-dev

  - name: at-spi2-core-lang
    pipeline:
      - uses: split/locales

  - name: libatk-1.0
    description: ATK library accessibility interfaces (1.0)
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/girepository-1.0
          mv ${{targets.destdir}}/usr/lib/libatk-1.0* ${{targets.subpkgdir}}/usr/lib/
          mv ${{targets.destdir}}/usr/lib/girepository-1.0/Atk-1.0.typelib ${{targets.subpkgdir}}/usr/lib/girepository-1.0/

  - name: libatk-bridge-2.0
    description: GTK+2.0 module that bridges ATK to D-Bus at-spi
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv ${{targets.destdir}}/usr/lib/gnome-settings-daemon-3.0 ${{targets.subpkgdir}}/usr/lib/
          mv ${{targets.destdir}}/usr/lib/gtk-2.0 ${{targets.subpkgdir}}/usr/lib/
          mv ${{targets.destdir}}/usr/lib/libatk-bridge-2.0* ${{targets.subpkgdir}}/usr/lib/
