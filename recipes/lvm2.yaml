# Wolfi's lvm2, with --enable-udev_sync and without --enable-static_link. Without udev_sync
# libdevmapper makes the /dev/mapper/* nodes itself, udev cannot lay its links there, and systemd
# never sees dev-mapper-root.device: the verity root is set up and never mounted. Its static
# binaries go with it - there is no static libudev to link them with. Wolfi's test blocks are
# dropped (their pipelines are Wolfi CI's); the rest is Wolfi's recipe as it is,
# --disable-nls included: lvm2's po/Makefile builds no catalog (its TARGETS line is commented out
# upstream) and its install then fails on the one translation it names.
package:
  name: lvm2
  version: "2.03.43"
  # Replaces Wolfi's lvm2 2.03.43 (epoch 0): see the header.
  epoch: 1
  description: Logical Volume Manager 2 utilities
  copyright:
    - license: GPL-2.0-only AND LGPL-2.1-only
  dependencies:
    runtime:
      - merged-lib
      - merged-sbin
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

var-transforms:
  - from: ${{package.version}}
    match: '\.'
    replace: '_'
    to: mangled-package-version

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - glibc-2.44-dev
      - libaio-dev
      - linux-headers
      - util-linux-dev
      # libudev, for --enable-udev_sync.
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/lvmteam/lvm2.git
      tag: v${{vars.mangled-package-version}}
      expected-commit: 7b0bce6909611966bdc1e17c2408e1ec3b0f8c17

  - runs: |
      # during cross-compilation malloc test goes wrong
      export ac_cv_func_malloc_0_nonnull=yes
      export ac_cv_func_realloc_0_nonnull=yes
      ./configure \
        --build=$CBUILD \
        --host=$CHOST \
        --prefix=/usr \
        --sysconfdir=/etc \
        --libdir=/usr/lib \
        --sbindir=/usr/bin \
        --with-usrsbindir=/usr/bin \
        --with-staticdir=/usr/bin \
        --localstatedir=/var \
        --disable-nls \
        --disable-readline \
        --enable-pkgconfig \
        --with-thin=internal \
        --enable-dmeventd \
        --enable-cmdlib \
        --with-thin-check=/usr/bin/thin_check \
        --disable-thin_check_needs_check \
        --with-thin-dump=/usr/bin/thin_dump \
        --with-thin-repair=/usr/bin/thin_repair \
        --with-thin-restore=/usr/bin/thin_restore \
        --with-cache-check=/usr/bin/cache_check \
        --disable-cache_check_needs_check \
        --with-cache-dump=/usr/bin/cache_dump \
        --with-cache-repair=/usr/bin/cache_repair \
        --with-cache-restore=/usr/bin/cache_restore \
        --with-dmeventd-path=/usr/bin/dmeventd \
        --without-systemd-run \
        --enable-udev_rules \
        --enable-udev_sync \
        CLDFLAGS="$LDFLAGS"

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: make install_systemd_units DESTDIR="${{targets.destdir}}" V=1
    working-directory: scripts

  # make install leaves its binaries read-only (555); strip rewrites them in place, which an
  # unprivileged build (task build's bubblewrap) cannot do to a file it may not write.
  - runs: chmod -R u+w "${{targets.destdir}}"

  - uses: strip

subpackages:
  - name: lvm2-static
    pipeline:
      - uses: split/static
    description: lvm2 static
    dependencies:
      runtime:
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout

  - name: device-mapper-static
    pipeline:
      - uses: split/static
    description: lvm2 static
    dependencies:
      runtime:
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
    # test added by a robot. The APK was empty when it was checked,
    # which may not be true forever. If this test fails in the future, please
    # replace it with a more accurate test.
  - name: device-mapper-libs
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/
          mv ${{targets.destdir}}/usr/lib/libdevmapper.so.* ${{targets.subpkgdir}}/usr/lib/
    dependencies:
      runtime:
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout

  - name: device-mapper-event-libs
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/
          mv ${{targets.destdir}}/usr/lib/libdevmapper-event.so.* ${{targets.subpkgdir}}/usr/lib/
    dependencies:
      runtime:
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout

  - name: lvm2-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout

  - name: lvm2-doc
    pipeline:
      - uses: split/manpages
    description: lvm2 manpages
    dependencies:
      runtime:
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout

  - name: device-mapper
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          for i in ${{targets.destdir}}/usr/bin/*; do
            case "${i##*/}" in
              dm*.static) ;;
              dm*) mv "$i" ${{targets.subpkgdir}}/usr/bin ;;
            esac
          done
          mkdir -p ${{targets.subpkgdir}}/usr/lib/systemd/system/
          mv ${{targets.destdir}}/usr/lib/systemd/system/dm-* ${{targets.subpkgdir}}/usr/lib/systemd/system/
          mv ${{targets.destdir}}/usr/lib/systemd/system/lvm2-monitor.service ${{targets.subpkgdir}}/usr/lib/systemd/system/
    dependencies:
      runtime:
        - lvm2
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout

update:
  enabled: true
  release-monitor:
    identifier: 5354
