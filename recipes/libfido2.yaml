package:
  name: libfido2
  version: "1.17.0"
  # Replaces Wolfi's libfido2 1.17.0 (epoch 6), built without PC/SC: a security key held to a USB
  # NFC reader (CCID, through pcscd - the X9 has no NFC of its own) reached nothing in the session.
  # Wolfi's recipe with -DUSE_PCSC=ON, which upstream still calls experimental; the kernel's own
  # NFC transport (NFC_LINUX) stays on. The initrd has no pcscd: the disk opens with a key over USB.
  epoch: 7
  description: library for FIDO 2.0 functionality
  copyright:
    - license: BSD-2-Clause

vars:
  openssl-version: "4.0"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glibc-2.44-dev
      - libcbor-dev
      - linux-headers
      - openssl-hardened-${{vars.openssl-version}}-dev
      - pcsc-lite-dev
      - systemd-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: b974e7cf2ee7392134cc12c08b76a068cf250dd8
      repository: https://github.com/Yubico/libfido2
      tag: ${{package.version}}

  - uses: cmake/configure
    with:
      opts: -DUSE_PCSC=ON

  - uses: cmake/build

  - uses: cmake/install

  - runs: |
      install -Dm644 -t ${{targets.contextdir}}/usr/lib/udev/rules.d/ ./udev/70-u2f.rules

  - uses: strip

subpackages:
  - name: libfido2-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libfido2
        - openssl-${{vars.openssl-version}}-dev
    description: libfido2 dev

  - name: libfido2-doc
    pipeline:
      - uses: split/alldocs
    description: libfido2 manpages

  - name: fido2
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/* ${{targets.contextdir}}/usr/bin/
