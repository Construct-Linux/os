# Intel's Sound Open Firmware: the audio DSP's firmware and topologies from Tiger Lake to Panther
# Lake, which a laptop with its codecs on SoundWire (the ThinkPad X9's) has no sound without.
# linux-firmware stopped carrying it; Wolfi has no recipe. sof-bin's release, laid out where the
# kernel looks (intel/sof-ipc4/ptl/..., as its install.sh does), without its debugging tools.
# Uncompressed: the root's EROFS compresses it.
package:
  name: sof-firmware
  version: 2026.09.2
  epoch: 0
  description: Sound Open Firmware and topologies for Intel's audio DSP
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime: []

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/thesofproject/sof-bin/releases/download/v${{package.version}}/sof-bin-${{package.version}}.tar.gz
      expected-sha256: 5f7bc30b2b5c1e6b0da55a33fc44e2b7f56ae9b06952edcde614f51ef6b943e1

  - runs: |
      dest=${{targets.destdir}}/usr/lib/firmware/intel
      mkdir -p "$dest" ${{targets.destdir}}/usr/share/licenses/sof-firmware
      for d in sof sof-tplg sof-ipc4 sof-ipc4-lib sof-ipc4-tplg sof-ace-tplg; do
        cp -a "$d" "$dest/"
      done
      test -f "$dest/sof-ipc4/ptl/intel-signed/sof-ptl.ri"
      cp LICENCE.Intel LICENCE.NXP Notice.NXP ${{targets.destdir}}/usr/share/licenses/sof-firmware/
