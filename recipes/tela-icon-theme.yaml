package:
  name: tela-icon-theme
  version: 2026.08.10
  epoch: 2
  description: Tela flat icon theme (Tela, Tela-dark)
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    # index.theme inherits from these; an icon Tela lacks falls back to them.
    runtime:
      - adwaita-icon-theme
      - hicolor-icon-theme

environment:
  contents:
    packages:
      # install.sh is POSIX sh, busybox's enough.
      - busybox

pipeline:
  # The fork's gnome-51 branch: upstream master (2026-08-10) plus an icon for Decibels, the
  # one visible app of the image Tela had none for.
  - uses: git-checkout
    with:
      repository: https://github.com/Construct-Linux/Tela-icon-theme
      branch: gnome-51
      expected-commit: d57c29abab34534840577f64bf5cff05e4942dcd

  # Only the standard folder colour: each further colour is another full copy of the theme.
  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/share/icons
      sh ./install.sh -d "${{targets.destdir}}"/usr/share/icons
      for t in Tela Tela-dark; do
        test -f "${{targets.destdir}}/usr/share/icons/$t/index.theme"
        test -e "${{targets.destdir}}/usr/share/icons/$t/scalable/apps/org.gnome.Decibels.svg"
      done
      # The read-only root's icon caches are baked by the image build; a cache shipped
      # here would be overwritten there anyway.
      rm -f "${{targets.destdir}}"/usr/share/icons/*/icon-theme.cache
