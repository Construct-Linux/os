package:
  name: localsearch
  version: 3.12.0
  epoch: 0
  description: Filesystem indexer and metadata extractors for TinySPARQL
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - dbus-dev
      - ffmpeg-8.1-dev
      - giflib-dev
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - icu-dev
      - libgsf-dev
      - libseccomp-dev
      - libxml2-dev
      - libzip-dev
      - linux-headers
      - meson
      - ninja
      - poppler-dev
      - python-3.13
      - systemd-dev
      - tinysparql-dev
      - upower-dev
      - zlib-dev

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/localsearch/${{vars.series}}/localsearch-${{package.version}}.tar.xz
      expected-sha256: 4bf45440ce7a899f2eca4d20343d31fc620fa2a3fe53bb929de244305330e930

  # bash_completion stays on: with it off, the 3.12.0 summary references an undefined bash_completion_dir and configure fails.
  # Off because Wolfi lacks the library: gexiv2 (raw, exif, iptc, and the jpeg, png, tiff and webp extractors, which include gexiv2 headers unconditionally), exempi (xmp), libosinfo (iso), totem-pl-parser (playlist), libcue (cue), libgxps (xps).
  # libmediainfo off: libav already covers audio and video. writeback off: its XMP and audio-tag writers need exempi and taglib.
  - uses: meson/configure
    with:
      opts: -Dman=false -Dfunctional_tests=false -Dsandbox_tests=false -Dsystemd_user_services=true -Dsystemd_user_services_dir=/usr/lib/systemd/user -Dminer_fs=true -Dextract=true -Dwriteback=false -Dseccomp=true -Dlandlock=enabled -Dfanotify=enabled -Dbattery_detection=upower -Dcharset_detection=icu -Dxmp=disabled -Draw=disabled -Diso=disabled -Dplaylist=disabled -Dcue=disabled -Dxps=disabled -Dlibav=enabled -Dlibmediainfo=disabled -Dexif=disabled -Dgif=enabled -Dgsf=enabled -Djpeg=disabled -Dpdf=enabled -Dpng=disabled -Dtiff=disabled -Dxml=enabled -Dwebp=disabled -Dzip=enabled -Diptc=disabled

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "3.12"

subpackages:
  - name: localsearch-lang
    pipeline:
      - uses: split/locales
