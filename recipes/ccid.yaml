# The CCID driver pcscd loads for a USB smart card reader: a YubiKey's smart card side (PIV, OpenPGP,
# OATH, which ykman and gpg reach through pcscd) and a desk NFC reader. Wolfi has no recipe. Its
# udev rule gives the readers to the pcscd group, which pcscd runs as.
package:
  name: ccid
  version: "1.8.4"
  epoch: 0
  description: Generic USB CCID smart card reader driver
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    runtime:
      - pcsc-lite

environment:
  contents:
    packages:
      - build-base
      - busybox
      - flex-dev
      - libusb-dev
      - meson
      - ninja
      - pcsc-lite-dev
      - perl
      - pkgconf
      - systemd-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/LudovicRousseau/CCID
      tag: ${{package.version}}
      expected-commit: c37cf6cb42279ce9648ff7314180c866d68f9e0d

  - uses: meson/configure
    with:
      opts: -Dudev-rules=true

  - uses: meson/compile

  - uses: meson/install

  - runs: |
      test -f ${{targets.destdir}}/usr/lib/udev/rules.d/92_pcscd_ccid.rules
      test -n "$(find ${{targets.destdir}}/usr/lib/pcsc/drivers -name libccid.so)"

  - uses: strip
