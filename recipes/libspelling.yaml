package:
  name: libspelling
  version: 0.4.10
  epoch: 0
  description: Spellcheck library for GTK 4
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - enchant2-dev
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - gtk-4-dev
      - gtksourceview5-dev
      - icu-dev
      - meson
      - ninja

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/libspelling/${{vars.series}}/libspelling-${{package.version}}.tar.xz
      expected-sha256: 56e3f01a3a18b575beea4c34349f99cdaba316e1f7c271b1231f7bcf5d9af73b

  - uses: meson/configure
    with:
      opts: -Dintrospection=enabled -Denchant=enabled -Dvapi=false -Ddocs=false -Dsysprof=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

vars:
  series: "0.4"

subpackages:
  - name: libspelling-dev
    pipeline:
      - uses: split/dev

  - name: libspelling-lang
    pipeline:
      - uses: split/locales
