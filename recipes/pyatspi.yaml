# pyatspi: the Python face of AT-SPI, through which Orca, the screen reader, reads every
# application's accessible tree. Wolfi has none.
package:
  name: pyatspi
  version: "2.58.2"
  epoch: 0
  description: Python bindings for at-spi
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    provides:
      - py3.13-pyatspi=${{package.full-version}}
    runtime:
      - at-spi2-core
      - py3.13-gobject3
      - python-3.13

environment:
  contents:
    packages:
      - build-base
      - busybox
      - meson
      - ninja
      - pkgconf
      - py3.13-gobject3-dev
      - python-3.13

vars:
  series: "2.58"

pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/pyatspi/${{vars.series}}/pyatspi-${{package.version}}.tar.xz
      expected-sha256: 24590e5b60fec8dfb59fcd27d2a90de7034060be318ca3f7770e0f984f1f94e2

  - uses: meson/configure
    with:
      opts: -Denable_tests=false

  - uses: meson/compile

  - uses: meson/install
