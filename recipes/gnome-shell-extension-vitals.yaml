package:
  name: gnome-shell-extension-vitals
  version: 86.0.0
  epoch: 0
  description: GNOME Shell extension showing temperature, voltage, fan, memory, CPU, network and storage
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - gnome-shell
      # sensors.js imports gi://GTop for storage usage and silently drops it when the typelib is
      # missing; melange cannot see a GI import, so the dependency is written out.
      - libgtop
      # The Wi-Fi signal comes from NetworkManager (gi://NM), as the shell's own network menu's does.
      - libnm

environment:
  contents:
    packages:
      - busybox
      - glib

pipeline:
  # v86 plus, on the fork's gnome-51 branch: sensor reads dropped once destroyed (upstream #542, a
  # crash after lock or suspend), interfaces that go away pruned (#557), only physical interfaces
  # summed (#319: docker's veths and bridges counted the same traffic two or three times), the
  # per-core frequency read only while a frequency row is shown, and the public IP lookup and its
  # flags left out. v86 brings drivetemp drives named by their model, System Monitor's swap and
  # network icons, and the panel icons' gaps measured per icon.
  - uses: git-checkout
    with:
      repository: https://github.com/Construct-Linux/Vitals
      branch: gnome-51
      expected-commit: b102629c41b4091f696abe16a893fd2dc504eebf

  # Wi-Fi 7 cards have no wireless extensions: /proc/net/wireless, which Vitals read for the link
  # quality, has no line for them, and the read made the kernel warn at every login ("uses wireless
  # extensions which will stop working for Wi-Fi 7 hardware"; a ThinkPad X9-15p's BE211). The
  # quality comes from NetworkManager instead, for any card; the signal level in dBm, which
  # NetworkManager does not publish, is no longer shown.
  - uses: patch
    with:
      patches: gnome-shell-extension-vitals/wifi-from-networkmanager.patch

  # Upstream ships no build system: the extension is its source tree. The schema goes to the
  # system directory because the image compiles schemas there at build; the .po/.pot sources stay
  # out because the compiled .mo catalogs sit in the repository and the shell reads them from the
  # extension's own locale/ directory.
  - runs: |
      glib-compile-schemas --strict --dry-run schemas
      ext=${{targets.destdir}}/usr/share/gnome-shell/extensions/${{vars.uuid}}
      mkdir -p "$ext"
      cp -r extension.js helpers icons menuItem.js metadata.json prefs.js prefs.ui sensors.js \
        stylesheet.css values.js "$ext"/
      for mo in locale/*/LC_MESSAGES/vitals.mo; do
        install -Dm644 "$mo" "$ext/$mo"
      done
      install -Dm644 schemas/org.gnome.shell.extensions.vitals.gschema.xml \
        ${{targets.destdir}}/usr/share/glib-2.0/schemas/org.gnome.shell.extensions.vitals.gschema.xml
      grep -q '"51"' "$ext"/metadata.json

vars:
  uuid: Vitals@CoreCoding.com
