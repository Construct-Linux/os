# The desktop's root filesystem: Wolfi, and what recipes/ builds into packages/ on top of it.
# E2's image: enough for GDM to start a GNOME session in QEMU; nothing here is hardened yet.
contents:
  repositories:
    - https://packages.wolfi.dev/os
    - /work/packages
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - /work/melange.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - systemd
    - systemd-init
    - systemd-boot
    # The boot splash: SpinBot over a turning ring (cmd/image/plymouth.go).
    - plymouth
    - systemd-logind-service
    - systemd-timesyncd
    - systemd-userdb
    - shared-mime-info
    - fontconfig
    - udev
    - dbus
    - kmod
    - util-linux
    - util-linux-misc
    # What spin-desktop install and update run: mount and umount (their own packages in Wolfi),
    # and the ESP's and /var's mkfs.
    - mount
    - umount
    - dosfstools
    - e2fsprogs
    # Updates: systemd-sysupdate (recipes/systemd-sysupdate; Wolfi's systemd has none), and the
    # gpg it checks a release's SHA256SUMS.gpg with.
    - systemd-sysupdate
    - gpg
    - shadow
    - coreutils
    - bash
    - bash-binsh
    - kbd
    # sshd for systemd-ssh-generator, which listens only on AF_VSOCK in a VM, with keys only from
    # a credential: the test harness's way in, and nothing on a machine that has neither.
    - openssh-server
    - sudo
    # Graphics, input and sound below the session.
    - mesa
    - mesa-egl
    - mesa-gbm
    - mesa-gl
    - mesa-gles
    - mesa-libgallium
    # Vulkan: Intel (anv), AMD (radv), and lavapipe for what has neither (a VM).
    - mesa-vulkan-intel
    - mesa-vulkan-ati
    - mesa-vulkan-swrast
    - vulkan-loader
    - libinput
    # libinput's device quirks (/usr/share/libinput) are in -libs, which nothing depends on.
    - libinput-libs
    - xkeyboard-config
    - pipewire
    - pipewire-pulse
    - wireplumber
    - bluez
    - polkit
    # GNOME Shell's JavaScript reaches GLib, GObject, Gio and cairo through their typelibs: glib's
    # are in glib-gir, cairo's only in gobject-introspection-dev.
    - glib-gir
    - gobject-introspection-dev
    - at-spi2-core
    # The session.
    - gdm
    - gnome-shell
    - gnome-session
    - gnome-settings-daemon
    - gnome-control-center
    - xdg-desktop-portal-gnome
    - ptyxis
    - xwayland
    - networkmanager
    - networkmanager-wifi
    - accountsservice
    - upower
    - udisks2
    - gnome-keyring
    - adwaita-icon-theme
    - hicolor-icon-theme
    - font-cantarell
    - adwaita-fonts
    - font-noto
    - glycin-2
    - wireless-regdb
    # What a session leans on: realtime priority for the compositor and PipeWire, Thunderbolt
    # authorisation, power profiles, the portals' GTK backend, GVfs (trash, mounts, network
    # places), the user's folders, and wallpapers.
    - rtkit
    - bolt
    - power-profiles-daemon
    - xdg-desktop-portal-gtk
    - gvfs
    - xdg-user-dirs
    - gnome-backgrounds
    # Apps.
    - nautilus
    - tinysparql
    - localsearch
    - gnome-text-editor
    - gnome-calculator
    - loupe
    - gnome-disk-utility
    - gnome-system-monitor
    # GNOME 51's core apps (gnome-build-meta's meta-gnome-core-apps), but those that need
    # WebKitGTK (Web, Help) or SANE (Document Scanner), and Console (Ptyxis is the terminal).
    - showtime
    - decibels
    - gnome-music
    - snapshot
    - gnome-clocks
    - gnome-weather
    - gnome-characters
    - gnome-font-viewer
    - baobab
    - gnome-logs
    - gnome-contacts
    - gnome-maps
    - gnome-connections
    - gnome-software
    - papers
    - gnome-calendar
    # The look (etc/dconf/db/local.d/00-spin-desktop): Orchis, Tela, Bibata.
    - orchis-theme
    - tela-icon-theme
    - bibata-cursor-theme
    # GNOME Shell extensions, built for 51; the defaults enable the first eight.
    - gnome-shell-extension-user-theme
    - gnome-shell-extension-appindicator
    - gnome-shell-extension-clipboard-indicator
    - gnome-shell-extension-just-perfection
    - gnome-shell-extension-caffeine
    - gnome-shell-extension-vitals
    - gnome-shell-extension-tiling-shell
    - gnome-shell-extension-dash-to-panel
    - gnome-shell-extension-workspace-indicator
    - gnome-shell-extension-drive-menu
    - gnome-shell-extension-night-theme-switcher
    - flatpak
    # sched_ext schedulers (kernel/desktop.config's SCHED_CLASS_EXT).
    - scx
    - font-noto-emoji
    - glibc-locale-en
    - glibc-locale-es
    - tzdata
    - libsecret
    # Media: GStreamer, which GNOME's apps and the screencast play and record through.
    - gstreamer
    - gst-plugins-base
    - gst-plugins-good
    # Apps Wolfi maintains itself.
    - firefox
    # Development: a compiler, make, git, and Docker on containerd.
    - build-base
    - make
    - gcc
    - git
    - openssh-client
    - curl
    - vim
    - less
    - dockerd-29
    - dockerd-service-29
    - docker-init-29
    - docker-cli
    - docker-cli-buildx
    - docker-compose
    - containerd-2
    - containerd-service-2
    - runc
    - iptables-nft

accounts:
  run-as: root

archs:
  - x86_64
