# The desktop's root filesystem: Wolfi, and what recipes/ builds into packages/ on top of it.
contents:
  repositories:
    - https://packages.wolfi.dev/os
    - /work/packages
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - /work/melange.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - systemd
    - systemd-init
    - systemd-boot
    # The boot screen: the brand's animation (cmd/image/plymouth.go), and its logo as the icon
    # os-release's LOGO names.
    - plymouth
    - construct-brand
    - systemd-logind-service
    - systemd-timesyncd
    - systemd-userdb
    - shared-mime-info
    - fontconfig
    - udev
    - dbus
    - kmod
    - util-linux
    - util-linux-misc
    # util-linux's su, by name: util-linux-login needs a cmd:su, and Heimdal's Kerberos su
    # declares a higher version of it (7.8 against 2.42), so the resolver picked that one as the
    # setuid su - with Kerberos in tow.
    - util-linux-su
    # What construct install and update run: mount and umount (their own packages in Wolfi),
    # and the ESP's and /var's mkfs.
    - mount
    - umount
    - dosfstools
    - e2fsprogs
    # Updates: systemd-sysupdate (recipes/systemd's subpackage; Wolfi's systemd has none), and the
    # gpg it checks a release's SHA256SUMS.gpg with.
    - systemd-sysupdate
    - gpg
    # The TPM2 stack (libtss2-*), which systemd (recipes/systemd, built with TPM2) loads at run time,
    # so nothing depends on it: construct install enrolls /var's key with systemd-cryptenroll.
    - tpm2-tss
    # libbpf, which systemd (recipes/systemd, built with BPF) loads at run time for its cgroup BPF
    # features (RestrictFileSystems=, IP accounting and filters), so nothing depends on it.
    # Without it every unit's start logs that libbpf.so.0 is missing.
    - libbpf
    # device-mapper's udev rules, which make /dev/mapper/* for the root's verity device.
    - device-mapper
    - shadow
    - coreutils
    - bash
    - bash-binsh
    - kbd
    # sshd for systemd-ssh-generator, which listens only on AF_VSOCK in a VM, with keys only from
    # a credential: the test harness's way in, and nothing on a machine that has neither.
    - openssh-server
    - sudo
    # Graphics, input and sound below the session.
    - mesa
    - mesa-egl
    - mesa-gbm
    - mesa-gl
    - mesa-gles
    - mesa-libgallium
    # Vulkan: Intel (anv), AMD (radv), and lavapipe for what has neither (a VM).
    - mesa-vulkan-intel
    - mesa-vulkan-ati
    - mesa-vulkan-swrast
    - vulkan-loader
    # Video decoding and encoding on the GPU (VA-API): libva loads Intel's iHD driver for Iris Xe
    # and mesa's for AMD; Firefox and GStreamer's va plugin (gst-plugins-bad) go through it.
    - libva
    - intel-media-driver
    - libinput
    # libinput's device quirks (/usr/share/libinput) are in -libs, which nothing depends on.
    - libinput-libs
    - xkeyboard-config
    - pipewire
    - pipewire-pulse
    - wireplumber
    # Laptops whose audio goes through Intel's DSP over SoundWire (the ThinkPad X9's): its firmware
    # and topologies, and the UCM profiles that say which device is the speakers, the headphones
    # and the microphones (recipes/sof-firmware, recipes/alsa-ucm-conf).
    - sof-firmware
    - alsa-ucm-conf
    # lm-sensors (sensors, sensors-detect) and i2c-tools: the temperatures, fans and voltages the
    # kernel's hwmon drivers report, and the I2C buses they sit on.
    - lm-sensors
    - lm-sensors-detect
    - i2c-tools
    - bluez
    - polkit
    # GNOME Shell's JavaScript reaches GLib, GObject, Gio and cairo through their typelibs: glib's
    # are in glib-gir, cairo's only in gobject-introspection-dev.
    - glib-gir
    - gobject-introspection-dev
    - at-spi2-core
    # The session.
    - gdm
    - gnome-shell
    - gnome-session
    - gnome-settings-daemon
    - gnome-control-center
    - xdg-desktop-portal-gnome
    # The default terminal: Ghostty, by xdg-terminal-exec (etc/xdg/xdg-terminals.list). Ptyxis
    # stays for its profile into the Wolfi container.
    - ghostty
    - xdg-terminal-exec
    - ptyxis
    - xwayland
    - networkmanager
    - networkmanager-wifi
    # .local names through avahi, the one mDNS stack (etc/nsswitch.conf's mdns4_minimal).
    - nss-mdns
    # VPNs: WireGuard is NetworkManager's own (wireguard-tools for wg); OpenVPN is a plugin.
    - networkmanager-openvpn
    - wireguard-tools
    # Printing: CUPS, OpenPrinting's filters and driverless support, the network's printers found
    # (cups-browsed), USB ones that speak IPP (ipp-usb), Settings administering them (cups-pk-helper).
    - cups
    - cups-filters
    - cups-browsed
    - cups-pk-helper
    - ipp-usb
    # A person's first login: language, keyboard, privacy, online accounts.
    - gnome-initial-setup
    # Firmware updates from LVFS, which GNOME Software shows.
    - fwupd
    # util-linux's lsblk, which BusyBox's has no options of.
    - lsblk
    # NetworkManager joins Wi-Fi through wpa_supplicant (recipes/wpa_supplicant: Wolfi has none).
    - wpa_supplicant
    - accountsservice
    - upower
    - udisks2
    - gnome-keyring
    - adwaita-icon-theme
    - hicolor-icon-theme
    - adwaita-fonts
    - font-noto
    - glycin-2
    - wireless-regdb
    # What a session leans on: realtime priority for the compositor and PipeWire, Thunderbolt
    # authorisation, power profiles, the portals' GTK backend, GVfs (trash, mounts, network
    # places), the user's folders, and wallpapers.
    - rtkit
    - bolt
    - power-profiles-daemon
    - xdg-desktop-portal-gtk
    - gvfs
    - xdg-user-dirs
    # Apps.
    - nautilus
    - tinysparql
    - localsearch
    - gnome-text-editor
    - gnome-calculator
    - loupe
    - gnome-disk-utility
    - gnome-system-monitor
    # GNOME 51's core apps (gnome-build-meta's meta-gnome-core-apps), but those that need
    # WebKitGTK (Web, Help) or SANE (Document Scanner), and Console (Ptyxis is the terminal).
    - showtime
    - decibels
    - gnome-music
    - snapshot
    - gnome-clocks
    - gnome-weather
    - gnome-characters
    - gnome-font-viewer
    - baobab
    - gnome-logs
    - gnome-contacts
    - gnome-maps
    - gnome-connections
    - gnome-software
    - papers
    - gnome-calendar
    # The look (etc/dconf/db/local.d/00-construct): Orchis, Tela, Bibata. orchis-theme-shell is
    # the shell's own theme resource drawn by Orchis, the one the lock screen and GDM read too.
    - orchis-theme
    - orchis-theme-shell
    - tela-icon-theme
    - bibata-cursor-theme
    # GNOME Shell extensions, built for 51; the defaults enable the first eight.
    - gnome-shell-extension-user-theme
    - gnome-shell-extension-appindicator
    - gnome-shell-extension-clipboard-indicator
    - gnome-shell-extension-just-perfection
    - gnome-shell-extension-caffeine
    - gnome-shell-extension-vitals
    - gnome-shell-extension-tiling-shell
    - gnome-shell-extension-dash-to-panel
    - gnome-shell-extension-workspace-indicator
    - gnome-shell-extension-drive-menu
    - gnome-shell-extension-night-theme-switcher
    - flatpak
    # p11-kit's server, which flatpak-session-helper starts to share the host's PKCS#11 modules
    # (certificates, smartcards) with sandboxed apps: without it the helper logs a failure.
    - p11-kit-server
    # sched_ext schedulers (kernel/desktop.config's SCHED_CLASS_EXT).
    - scx
    # scx_loader, which starts and switches it (etc/scx_loader.toml).
    - scx-loader
    - font-noto-emoji
    - glibc-locale-en
    - glibc-locale-es
    - tzdata
    - libsecret
    # Media: GStreamer, which GNOME's apps and the screencast play and record through.
    - gstreamer
    - gst-plugins-base
    - gst-plugins-good
    - gst-plugins-bad
    # Apps Wolfi maintains itself.
    - firefox
    # Development: Visual Studio Code, a compiler, make, git, Docker on containerd, and distrobox
    # for languages and tools in a Wolfi container (etc/distrobox/distrobox.conf).
    - code
    - distrobox
    - build-base
    - make
    - gcc
    - git
    - openssh-client
    - curl
    - vim
    - less
    # Task (recipes/task), the runner this repository and many projects drive their builds with;
    # ifconfig, route, netstat and arp for scripts and habits that still call them (net-tools).
    - task
    - net-tools
    # powertop: what keeps a laptop from its low-power states, and its tunables (construct power).
    - powertop
    # Swap in compressed RAM (usr/lib/systemd/zram-generator.conf), and construct bench's
    # workloads: schbench (recipes/), stress-ng and fio.
    - zram-generator
    - schbench
    - stress-ng
    - fio
    # A laptop's own: its light, motion and proximity sensors over D-Bus (automatic brightness,
    # rotation), started by udev; Intel's low-power-mode daemon, installed and not enabled until
    # it is measured (recipes/intel-lpmd). No fingerprint reader: the lock screen and sudo ask for
    # the password, and nothing else would take a finger.
    - iio-sensor-proxy
    - intel-lpmd
    # libfido2, which systemd-cryptenroll and systemd-cryptsetup open at run time for a security key,
    # and its tools: fido2-token lists keys and sets a new key's PIN, for the installer and a person.
    - libfido2
    - fido2
    # script (util-linux): a terminal for a program that reads one, fido2-token's new-PIN prompt
    # among them.
    - script
    - dockerd-29
    - dockerd-service-29
    - docker-init-29
    - docker-cli
    - docker-cli-buildx
    - docker-compose
    - containerd-2
    - containerd-service-2
    - runc
    - iptables-nft
    # nft, which loads the firewall (usr/lib/construct/firewall.nft).
    - nftables
    # Tailscale (usr/lib/systemd/system/tailscaled.service).
    - tailscale
    # Translations: Wolfi and recipes/ put a package's catalogs in <name>-lang, which nothing
    # installs unless it is named here. go run ./cmd/image check-langs (in task rootfs) fails the
    # build when one is missing.
    - at-spi2-core-lang
    - cracklib-lang
    - cups-pk-helper-lang
    - decibels-lang
    - evolution-data-server-lang
    - flatpak-lang
    - folks-lang
    - fwupd-lang
    - gcr4-lang
    - gdk-pixbuf-lang
    - gdm-lang
    - glib-lang
    - glib-networking-lang
    - gnome-calculator-lang
    - gnome-calendar-lang
    - gnome-characters-lang
    - gnome-clocks-lang
    - gnome-connections-lang
    - gnome-contacts-lang
    - gnome-disk-utility-lang
    - gnome-font-viewer-lang
    - gnome-initial-setup-lang
    - gnome-keyring-lang
    - gnome-logs-lang
    - gnome-maps-lang
    - gnome-music-lang
    - gnome-session-lang
    - gnome-shell-extension-appindicator-lang
    - gnome-shell-extension-caffeine-lang
    - gnome-shell-extension-clipboard-indicator-lang
    - gnome-shell-extension-just-perfection-lang
    - gnome-shell-lang
    - gnome-software-lang
    - gnome-system-monitor-lang
    - gnome-text-editor-lang
    - gnome-weather-lang
    - grilo-lang
    - grilo-plugins-lang
    - gst-plugins-base-lang
    - gtk-3-lang
    - gtk-4-lang
    - gtk-vnc-lang
    - gtksourceview5-lang
    - gvfs-lang
    - ibus-lang
    - libadwaita-lang
    - libgphoto2-lang
    - libgweather4-lang
    - libhandy1-lang
    - libpwquality-lang
    - libsecret-lang
    - libshumate-lang
    - libsoup3-lang
    - libspelling-lang
    - localsearch-lang
    - loupe-lang
    - mutter-lang
    - nautilus-lang
    - networkmanager-lang
    - networkmanager-openvpn-lang
    - papers-lang
    - polkit-lang
    - popt-lang
    - ghostty-lang
    - ptyxis-lang
    - shared-mime-info-lang
    - showtime-lang
    - snapshot-lang
    - tinysparql-lang
    - totem-pl-parser-lang
    - udisks2-lang
    - vte3-lang
    - xdg-user-dirs-lang

accounts:
  run-as: root

archs:
  - x86_64
