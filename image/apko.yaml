# The desktop's root filesystem: Wolfi, and what recipes/ builds into packages/ on top of it.
# E2's image: enough for GDM to start a GNOME session in QEMU; nothing here is hardened yet.
contents:
  repositories:
    - https://packages.wolfi.dev/os
    - /work/packages
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - /work/melange.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - systemd
    - systemd-init
    - systemd-logind-service
    - systemd-timesyncd
    - systemd-userdb
    - shared-mime-info
    - fontconfig
    - udev
    - dbus
    - kmod
    - util-linux
    - shadow
    - coreutils
    - bash
    - sudo
    # Graphics, input and sound below the session.
    - mesa
    - mesa-egl
    - mesa-gbm
    - mesa-gl
    - mesa-gles
    - mesa-libgallium
    - libinput
    - xkeyboard-config
    - pipewire
    - pipewire-pulse
    - wireplumber
    - bluez
    - polkit
    # The session.
    - gdm
    - gnome-shell
    - gnome-session
    - gnome-settings-daemon
    - gnome-control-center
    - xdg-desktop-portal-gnome
    - ptyxis
    - xwayland
    - networkmanager
    - networkmanager-wifi
    - accountsservice
    - upower
    - udisks2
    - gnome-keyring
    - adwaita-icon-theme
    - hicolor-icon-theme
    - font-cantarell
    - adwaita-fonts
    - font-noto
    - glycin-2
    - wireless-regdb

accounts:
  run-as: root

archs:
  - x86_64
