# The harness locks the screen (cmd/image test's lock-screen view) to see the extensions through
# a lock; GNOME does not lock a session whose user has no password, as the live user has. The test
# disk's live user gets one; a real one never does (the test layer stays off real disks).
[Service]
ExecStartPost=/bin/sh -c 'echo live:spindrift-test | chpasswd'
