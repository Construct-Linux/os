# Test images only: the shell's own debug log, which GLib drops without this - the extension
# manager says there when it loads each extension and what state it ended in, and the harness
# times each extension's load from it (shell-startup.txt). The shell's JavaScript logs under its
# own domain, which it sets once its environment is up (environment.js): what logs before that
# is Gjs-Console's, and nothing of the extensions'. Mutter's domain stays quiet.
[Service]
# Quoted: systemd reads the value's space as a second assignment otherwise.
Environment="G_MESSAGES_DEBUG=GNOME Shell"
