# E2's test user, whom GDM logs in automatically (etc/gdm/custom.conf).
u spin 1000 "Spin" /home/spin /bin/bash
m spin wheel
m spin video
m spin audio
m spin input
# GDM's own account, which its package does not declare; its greeters are dynamic users from
# systemd-userdb.
u gdm - "GNOME Display Manager" /var/lib/gdm
g docker -
m spin docker
