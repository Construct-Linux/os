# The image's own accounts. The person a machine is for is not here: construct install adds them to
# the installed /etc's passwd and shadow, and a root nobody is installed for boots into the live
# user construct live adds (internal/account). Both take docker (the daemon's socket, which docker's
# package declares) and wheel (sudo).
# GDM's own account, which its package does not declare; its greeters are dynamic users from
# systemd-userdb.
u gdm - "GNOME Display Manager" /var/lib/gdm
# avahi-daemon (mDNS: printers and devices on the local network) runs as this user; Wolfi's
# package does not declare it.
u avahi - "Avahi mDNS daemon" /run/avahi-daemon
# tpm2-tss's udev rules give the TPM's device nodes to tss, which its package does not declare.
u tss - "TPM2 software stack" /var/lib/tpm
# CUPS's SystemGroup (etc/cups/cups-files.conf), who administers printers; Wolfi's cups declares
# no group, and cupsd refuses to start on a config naming one that does not exist.
g lpadmin -
# 1Password's browser helper and MCP server are setgid to groups of their own, which their
# after-install.sh would make (cmd/construct onepassword.go installs them).
g onepassword -
g onepassword-mcp -
