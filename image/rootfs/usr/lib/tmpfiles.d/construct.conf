# What the read-only root links into /var (cmd/image usb's bake): homes, /opt, /srv, /mnt. Root's,
# /var/roothome, is systemd's provision.conf's (etc/tmpfiles.d): a second line for it is a
# duplicate systemd-tmpfiles logs at every boot.
d /var/home 0755 root root -
d /var/opt 0755 root root -
d /var/srv 0755 root root -
d /var/mnt 0755 root root -
d /var/lib/gdm 0711 gdm gdm -
# Flatpak apps see the GTK themes construct theme copies for each user, read-only: libadwaita and
# GTK 3 apps from Flathub (Chrome's own window among them) look like the ones in the image. f writes
# it once; an administrator's edit stays.
d /var/lib/flatpak/overrides 0755 root root -
f /var/lib/flatpak/overrides/global 0644 root root - [Context]\nfilesystems=xdg-config/gtk-4.0:ro;~/.themes:ro;\n
