d /var/home 0755 root root -
d /var/home/spin 0700 spin spin -
d /var/lib/gdm 0711 gdm gdm -
d /var/lib/sshd 0700 root root -
d /var/lib/NetworkManager/system-connections 0700 root root -
# Flatpak apps see the GTK 4 theme drift gtk4 copies for each user, read-only: the libadwaita apps
# from Flathub look like the ones in the image. f writes it once; an administrator's edit stays.
d /var/lib/flatpak/overrides 0755 root root -
f /var/lib/flatpak/overrides/global 0644 root root - [Context]\nfilesystems=xdg-config/gtk-4.0:ro;\n
