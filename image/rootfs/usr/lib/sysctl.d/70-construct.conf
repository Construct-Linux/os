# How memory, writeback and the network behave on a desktop, where a person waits on every stall.
# construct bench measures each against the kernel's own defaults, on the machine itself.

# Swap is zram (usr/lib/systemd/zram-generator.conf), compressed RAM: swapping to it costs far less
# than dropping a file page and reading it back from disk, so the kernel is told to prefer it, and
# to read one page at a time from it - readahead is for disks.
vm.swappiness = 150
vm.page-cluster = 0
# Keep the inode and dentry caches longer: what a desktop opens again and again is metadata.
vm.vfs_cache_pressure = 50
# Writeback in bounded amounts rather than a share of RAM, which on 32 GB lets gigabytes of a copy
# pile up and then stall every other writer while they flush.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500
# The NMI watchdog wakes every CPU periodically to catch a hard lockup: a server's concern, and a
# laptop's battery.
kernel.nmi_watchdog = 0

# BBR over fq, which paces each flow at the rate BBR sets: steadier throughput and less queueing
# delay on Wi-Fi and long paths than cubic. The kernel's own default qdisc is fq (platform.config),
# but systemd's 50-default.conf sets fq_codel at boot; this file comes after it.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
