# The computer's name is the one its person gave it (construct install), or os-release's
# DEFAULT_HOSTNAME on a stick - never the network's. With no static name NetworkManager took one
# from DHCP or from the reverse DNS of its address, and a network that answers for any address
# renamed the machine: AWS's resolver made a stick "ip-10-0-2-15.us-west-2.compute.internal",
# and avahi announced that instead of construct.local.
[main]
hostname-mode=none
