# A person's own programs: ~/.local/bin, where file-hierarchy(7) puts them, the one directory on
# the PATH they can write (/usr and /usr/local are the read-only root's). Last, so nothing there
# stands in for a command of the root's - sudo among them. The user manager's environment, and so
# the session's and every program GNOME starts; etc/profile.d/construct-local-bin.sh gives it to a
# login shell, whose PATH sshd and login set anew.
PATH=${PATH}:${HOME}/.local/bin
