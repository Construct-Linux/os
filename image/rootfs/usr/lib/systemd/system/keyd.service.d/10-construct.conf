# keyd reads every keyboard and writes one virtual keyboard: the input devices and /dev/uinput,
# and nothing else. Its own socket's group is keyd, which no person is in: only root rebinds keys.
# It runs as root to own the input devices, with two capabilities - a real-time thread and locked
# memory, so a key is never late - and may execute nothing but itself: a command() binding, which
# would run a shell as root, cannot.
[Service]
# keyd's handler for SIGTERM is exit(3) itself (keyd.c): stopped, it exits with status 15.
SuccessExitStatus=15
Group=keyd
RuntimeDirectory=keyd
RuntimeDirectoryMode=0750
CapabilityBoundingSet=CAP_SYS_NICE CAP_IPC_LOCK
NoNewPrivileges=yes
DevicePolicy=closed
DeviceAllow=char-input rw
DeviceAllow=/dev/uinput rw
NoExecPaths=/
ExecPaths=/usr/bin/keyd /usr/lib
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateNetwork=yes
RestrictAddressFamilies=AF_UNIX
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
