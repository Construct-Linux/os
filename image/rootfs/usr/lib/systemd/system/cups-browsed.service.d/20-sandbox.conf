# cups-browsed reads what printers on the network announce, outside input, as root: it gets the
# network, cupsd's socket and avahi's bus, its cache and log, and nothing else - no capability, no
# device, a read-only system, no other users' files. systemd-analyze security: 9.4 (UNSAFE) to 1.6.
[Service]
ProtectSystem=strict
ReadWritePaths=-/var/cache/cups -/var/log/cups
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectProc=invisible
NoNewPrivileges=yes
CapabilityBoundingSet=
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
