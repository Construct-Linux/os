# bluetoothd runs on a machine with no adapter too. Skipped (its ConditionPathIsDirectory=), a
# D-Bus activation of org.bluez - GNOME Settings, Chrome and the portal ask at every start - waits
# out dbus-daemon's whole 25 s timeout instead of failing; running, it answers at once that there
# is no adapter, and finds a USB one plugged in later.
[Unit]
ConditionPathIsDirectory=
