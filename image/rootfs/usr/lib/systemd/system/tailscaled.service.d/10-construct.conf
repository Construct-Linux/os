# tailscaled's logs go nowhere but this machine's journal: nothing of what it does is sent to
# log.tailscale.com, and Tailscale's support cannot read them (the same as --no-logs-no-support,
# which would take FLAGS from the person's /etc/default/tailscaled).
#
# Behind a firewall that breaks TLS (a Fortinet, which tailscaled names), it retries the control
# server and its relays without end and logs every attempt, all at info: 5308 lines in 90 minutes,
# against 224 in four days elsewhere. Its first minutes at boot are far under the burst, so the
# limit only cuts a retry loop, and journald says how many lines it suppressed.
[Service]
Environment=TS_NO_LOGS_NO_SUPPORT=true
LogRateLimitIntervalSec=10min
LogRateLimitBurst=100
