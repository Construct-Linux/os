# geoclue asks the network where the machine is: on top of its own unit's lockdown, no capability,
# no device, no other process, no namespace, and the system calls of a service. Measured:
# systemd-analyze security 7.5 (EXPOSED) to 1.3.
[Service]
PrivateDevices=yes
ProtectProc=invisible
CapabilityBoundingSet=
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
