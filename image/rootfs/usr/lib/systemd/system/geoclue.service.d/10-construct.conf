# GIO's proxy resolver from libproxy (0.5.12) leaves geoclue blocked on a lock before it takes its
# bus name, on most starts after the first: in the test VM 9 of 10 restarts timed out, and none of
# 10 with GLib's own resolver. A system service has no proxy settings for libproxy to read - its
# GSettings are in memory, and it has no session - so the dummy resolver (direct connections)
# loses nothing.
[Service]
Environment=GIO_USE_PROXY_RESOLVER=dummy
