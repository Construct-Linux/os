# polkit's PAM stack (etc/pam.d/polkit-1) takes the security key's touch first (construct-key,
# pam_u2f), which talks to the key through /dev/hidraw*: upstream's unit gives the helper a private
# /dev with no device in it, and with the setuid helper gone that would leave the password alone.
# The device policy stays closed but for hidraw.
[Service]
PrivateDevices=no
DeviceAllow=char-hidraw rw
