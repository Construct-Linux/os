# The loader's cache is baked into /usr/lib with the root (cmd/image bake), and /etc/ld.so.cache
# is a link to it. A new release's /usr is newer than /etc/.updated, so at its first boot
# ConditionNeedsUpdate ran ldconfig, which wrote a cache of its own over the link, into /etc's
# upper on /var: the map through /etc that pins /var at shutdown. Nothing is left for ldconfig to
# do on a read-only /usr.
[Unit]
ConditionPathIsReadWrite=/usr
