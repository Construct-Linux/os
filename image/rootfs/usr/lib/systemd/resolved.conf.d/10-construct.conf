# avahi-daemon is the machine's one mDNS stack: it answers for this machine on the local network
# (the preset enables it, for Files' network browsing and printers) and resolves .local names for
# glibc (nss-mdns, nsswitch.conf). resolved's mDNS off, resolving included: two stacks on port 5353
# made avahi warn of another stack and rename the host on a conflict with itself.
#
# LLMNR off: any machine on the network could answer for a name the DNS did not (the poisoning
# Responder automates), and nothing here names hosts by it; resolved listened for it on every
# interface (5355).
[Resolve]
MulticastDNS=no
LLMNR=no
