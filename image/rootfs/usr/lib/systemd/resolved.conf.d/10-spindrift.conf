# avahi-daemon answers for this machine on the local network (the preset enables it, for Files'
# network browsing); resolved only resolves .local names. Both answering is two responders on
# port 5353: avahi warns and renamed the host on a conflict with itself.
#
# LLMNR off: any machine on the network could answer for a name the DNS did not (the poisoning
# Responder automates), and nothing here names hosts by it; resolved listened for it on every
# interface (5355).
[Resolve]
MulticastDNS=resolve
LLMNR=no
