# systemd-oomd as Fedora Workstation runs it (its systemd-oomd-defaults): a desktop under memory
# pressure stays usable, the session that pressed it loses its largest cgroup instead of the
# kernel's OOM killer arriving minutes later. Pressure is acted on after 20 s, not the 30 s default.
[OOM]
DefaultMemoryPressureDurationSec=20s
