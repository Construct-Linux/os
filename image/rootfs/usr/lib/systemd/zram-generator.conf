# Swap in compressed RAM (zram), as large as RAM itself - zstd fits two to four pages in one -
# preferred over any swap on disk. systemd's zram-generator makes it at boot; the kernel's zswap,
# which would compress the same pages again, is off (kernel/desktop.config).
[zram0]
zram-size = ram
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
