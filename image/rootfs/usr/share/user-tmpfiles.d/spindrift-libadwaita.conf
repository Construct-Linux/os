# libadwaita apps take no GTK theme: they read only ~/.config/gtk-4.0. Linking Orchis's GTK 4
# styles there gives them the look GTK 3 apps and the shell have. L leaves a user's own file be.
d %h/.config/gtk-4.0 0700 - - -
L %h/.config/gtk-4.0/gtk.css - - - - /usr/share/themes/Orchis-Teal-Light/gtk-4.0/gtk.css
L %h/.config/gtk-4.0/gtk-dark.css - - - - /usr/share/themes/Orchis-Teal-Light/gtk-4.0/gtk-dark.css
L %h/.config/gtk-4.0/assets - - - - /usr/share/themes/Orchis-Teal-Light/gtk-4.0/assets
