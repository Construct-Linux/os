# The container a person's languages and tools live in: Wolfi, the packages the image is built
# from (apk add go-1.27), on the image's Docker. Ptyxis's Wolfi profile enters it, and the first
# distrobox enter creates it.
container_manager="docker"
container_image_default="cgr.dev/chainguard/wolfi-base:latest"
container_name_default="wolfi"
