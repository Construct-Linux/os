# The container a person's languages and tools live in: Wolfi, the packages the image is built
# from (apk add go-1.27), on the image's Docker. Ptyxis's Wolfi profile enters it, and the first
# distrobox enter creates it.
container_manager="docker"
container_image_default="cgr.dev/chainguard/wolfi-base:latest"
container_name_default="wolfi"
# The cloud CLIs live here rather than in the image: ~500 MiB, a second Python for aws, that every
# update of the image would download again. Installed when the container is first made, and
# updated with the rest of it (apk upgrade).
container_additional_packages="aws-cli-2 google-cloud-sdk"
# Wolfi's linux-pam names pam_systemd.so, which a container does not have, without PAM's "-"
# prefix for a module that may be absent: every chpasswd and passwd distrobox-init runs then logs
# it as faulty, into the machine's journal. Before distrobox-init, the line gets its "-".
# Ghostty, the terminal, says it is xterm-ghostty, which Wolfi's terminfo lacks (ncurses-terminfo
# too): without its entry ncurses programs refuse to start. The image's own is copied in.
container_pre_init_hook="apk add --no-cache linux-pam >/dev/null && sed -i 's/^session[[:space:]]*optional[[:space:]]*pam_systemd.so/-&/' /etc/pam.d/base-session-noninteractive && mkdir -p /usr/share/terminfo/x && cp /run/host/usr/share/terminfo/x/xterm-ghostty /usr/share/terminfo/x/"
