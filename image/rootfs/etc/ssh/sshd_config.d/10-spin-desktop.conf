# Ed25519 only: no RSA, no ECDSA - for the machine's own key and for anybody's who logs in. A
# hardware key's Ed25519 (sk-ssh-ed25519, a YubiKey's) is the same algorithm.
HostKeyAlgorithms ssh-ed25519
PubkeyAcceptedAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com
# The host key is on /var, made at first boot (spin-desktop-ssh-hostkeys.service): /etc is
# read-only. The one in /run is what a boot without a writable /var made; sshd skips a missing one.
HostKey /var/lib/sshd/ssh_host_ed25519_key
HostKey /run/sshd-keys/ssh_host_ed25519_key
