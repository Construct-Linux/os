# Super with a letter, as a Mac's Command: on every keyboard, in every application, from the
# console to GDM. Copy, paste and cut go as Ctrl+Insert, Shift+Insert and Shift+Delete, which
# GTK, browsers, VS Code and terminals take for the clipboard, so a terminal copies rather than
# interrupts. The rest go as Ctrl with the letter: in a terminal they are its control characters
# (Super+S stops output, Super+Q resumes it, Super+Z suspends). Super alone still opens the
# overview, and Ctrl+C and Ctrl+V work as before. `sudo keyd reload` after an edit.
[ids]
*

[meta]
c = C-insert
v = S-insert
x = S-delete
z = C-z
a = C-a
s = C-s
f = C-f
t = C-t
w = C-w
q = C-q
