# Super with a letter, as a Mac's Command: on every keyboard, in every application, from the
# console to GDM. Copy, paste and cut go as Ctrl+Insert, Shift+Insert and Shift+Delete, which
# GTK, browsers, VS Code and terminals take for the clipboard, so a terminal copies rather than
# interrupts. Each other letter goes as a plain key no keyboard has, F13 to F24, which the shell's
# keys extension (usr/share/gnome-shell/extensions/keys@constructlinux.org) turns into the chord
# the focused application binds for it - Ctrl+T in Files, Ctrl+Shift+T in a terminal - as
# usr/share/construct/keys.json says: one table for keyd, the extension and construct-keys, and
# go test ./cmd/image fails this file when it strays from it. Super alone still opens the
# overview, and Ctrl+C and Ctrl+V work as before. `sudo keyd reload` after an edit.
[ids]
*

[meta]
c = C-insert
v = S-insert
x = S-delete
a = f13
z = f14
s = f15
f = f16
t = f17
w = f18
n = f19
p = f20
q = f21
r = f22
l = f23
o = f24
