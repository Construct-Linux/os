# man-db's configuration: Wolfi's, but for where the indexes are. Wolfi's keeps them in
# /var/cache/man, for man-db.timer to rebuild daily; here bake builds them with the root (mandb,
# cmd/image/usb.go), inside each hierarchy, so apropos and whatis work from the first boot and
# change only when an update changes /usr, and no timer runs. A person's own pages, under
# ~/.local/share/man beside ~/.local/bin on the PATH, are found without an index.

MANDATORY_MANPATH			/usr/man
MANDATORY_MANPATH			/usr/share/man
MANDATORY_MANPATH			/usr/local/share/man

MANPATH_MAP	/bin			/usr/share/man
MANPATH_MAP	/usr/bin		/usr/share/man
MANPATH_MAP	/sbin			/usr/share/man
MANPATH_MAP	/usr/sbin		/usr/share/man
MANPATH_MAP	/usr/local/bin		/usr/local/man
MANPATH_MAP	/usr/local/bin		/usr/local/share/man
MANPATH_MAP	/usr/local/sbin		/usr/local/man
MANPATH_MAP	/usr/local/sbin		/usr/local/share/man
MANPATH_MAP	/opt/bin		/opt/man
MANPATH_MAP	/opt/sbin		/opt/man

MANDB_MAP	/usr/share/man		/usr/share/man
MANDB_MAP	/usr/local/share/man	/usr/local/share/man

# The formatted pages man would cache beside the index: the root is read-only.
NOCACHE

SECTION		1 n l 8 3 0 2 3type 5 4 9 6 7
