<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- GNOME's own faces for the generic families. Browsers, Electron and the web ask fontconfig for
     sans-serif, system-ui and monospace, which font-noto's 58-noto.conf would answer with Noto;
     GTK apps take Adwaita Sans and Adwaita Mono from gsettings instead, so without these the two
     kinds of app set text in different faces. Serif stays Noto, which Adwaita has none of, and Noto
     stays the fallback for the scripts Adwaita does not cover. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Adwaita Mono</family></prefer>
  </alias>
</fontconfig>
