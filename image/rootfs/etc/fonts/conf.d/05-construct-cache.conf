<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The fonts' cache in the read-only /usr beside the fonts, made at build (cmd/image bake), as
     Fedora's image-based desktops keep it: fonts.conf's /var/cache/fontconfig is on the /var
     partition, and the cache the build wrote there never reached a machine. fontconfig reads every
     cachedir and writes to the first it can, which on a booted machine is not this one. -->
<fontconfig>
	<cachedir>/usr/lib/fontconfig/cache</cachedir>
</fontconfig>
