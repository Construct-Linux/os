# systemd's own (/usr/share/factory/etc/nsswitch.conf), with .local names through avahi-daemon
# (nss-mdns's mdns4_minimal) before resolved: avahi is the machine's one mDNS stack, for Files'
# network browsing and printers too, and resolved's mDNS is off (resolved.conf.d/10-construct.conf).
# A .local name avahi does not know goes no further.

passwd:         files systemd
group:          files [SUCCESS=merge] systemd
shadow:         files systemd
gshadow:        files systemd

hosts:          mymachines mdns4_minimal [NOTFOUND=return] resolve [!UNAVAIL=return] files myhostname dns
networks:       files

protocols:      db files
services:       db files
ethers:         db files
rpc:            db files

netgroup:       nis
