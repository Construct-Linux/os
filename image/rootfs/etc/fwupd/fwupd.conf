[fwupd]
# db, dbx and KEK updates are Microsoft's, signed by its KEK CA, which this machine's KEK does
# not hold (internal/sign/secureboot.go: Construct's key alone): the firmware refuses each with
# EFI_SECURITY_VIOLATION, "Permission denied" at efivarfs. db carries Microsoft's option ROM CAs
# from the start, and 2023's CA for others' boot loaders is not wanted. Capsule updates stay.
DisabledPlugins=test;test_ble;invalid;uefi_db;uefi_dbx;uefi_kek
