[fwupd]
# Microsoft's dbx revocations apply: the KEK holds its KEK CAs for them
# (internal/sign/secureboot.go). Its db additions are not applied - db carries Microsoft's option
# ROM CAs from the start, and 2023's CA for others' boot loaders is not wanted - and its KEK
# updates are signed by OEM PKs, not Construct's: the firmware would refuse each with
# EFI_SECURITY_VIOLATION, "Permission denied" at efivarfs. Capsule updates stay.
DisabledPlugins=test;test_ble;invalid;uefi_db;uefi_kek
