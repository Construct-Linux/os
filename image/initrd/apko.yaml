# The initrd systemd runs in before the root: Wolfi's systemd, and what it does there - verity
# for the root (systemd-veritysetup, the dissect_image udev builtin finding the partitions by the
# root hash), /var made on a stick's first boot (systemd-repart, mkfs.ext4) or opened on an
# installed disk (systemd-cryptsetup, the TPM and the person's password), the /etc overlay
# mounted before the switch, the boot splash. No modules: storage, EROFS, ext4 and overlayfs are
# built into the kernel (kernel/desktop.config). cmd/image usb packs it as the UKI's initrd.
contents:
  repositories:
    - https://packages.wolfi.dev/os
    - /work/packages
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - /work/melange.rsa.pub
  packages:
    - wolfi-baselayout
    - systemd
    - udev
    - kmod
    - mount
    - umount
    - util-linux
    # sulogin, for the emergency shell; sfdisk moves a stick's backup GPT to its end before
    # systemd-repart looks for room for /var (spindrift-gpt-relocate.service).
    - util-linux-login
    # util-linux's su, by name: util-linux-login needs a cmd:su, and Heimdal's Kerberos su
    # declares a higher version of it (7.8 against 2.42), so the resolver picked that one as the
    # setuid su - with Kerberos in tow.
    - util-linux-su
    - sfdisk
    - e2fsprogs
    - cryptsetup
    # device-mapper's udev rules: without them no /dev/mapper/root appears for the verity device
    # systemd-veritysetup makes, and sysroot.mount waits for it until it times out.
    - device-mapper
    # 13-dm-disk.rules reads a device-mapper device's filesystem with blkid.
    - blkid
    # systemd-cryptsetup's TPM2 unlocking (recipes/systemd, built with TPM2), loaded at run time,
    # for an installed machine's encrypted /var.
    - tpm2-tss
    - plymouth
    # The font Plymouth writes the disk's password prompt in, GNOME's own (Adwaita Sans; the
    # package's other faces are trimmed, cmd/image initrdTrim): without one the prompt is boxes.
    - adwaita-fonts
    # The keyboard layouts Plymouth reads the password with (XKBLAYOUT in /etc/vconsole.conf, from
    # spindrift-boot-language.service): without them every key is a US keyboard's.
    - xkeyboard-config
    - bash
    - bash-binsh
    - coreutils

accounts:
  run-as: root

archs:
  - x86_64
