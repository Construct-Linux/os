# The installed machine's keyboard and language, for the disk's password prompt: credentials
# drift install leaves on the ESP (loader/credentials), which systemd-stub hands the initrd.
# vconsole.conf's XKB* lines are the layout Plymouth reads keys with; plymouthd.conf picks the
# theme that speaks the person's language. A credential that is not there leaves the file as it is.
f+^ /etc/vconsole.conf - - - - spindrift.vconsole
f+^ /etc/plymouth/plymouthd.conf - - - - spindrift.plymouth
