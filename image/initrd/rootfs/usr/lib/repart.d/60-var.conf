# /var, which systemd-repart makes on a stick's first boot in what the stick has beyond the image.
# Its UUID is the machine's - repart's default for a partition of type var is the HMAC of the
# machine id, as the Discoverable Partitions Specification asks, and the drop-in gives repart that
# id (--seed=%m) - so the dissect_image udev builtin designates it, and only on the machine that
# made it.
[Partition]
Type=var
Label=var
Format=ext4
