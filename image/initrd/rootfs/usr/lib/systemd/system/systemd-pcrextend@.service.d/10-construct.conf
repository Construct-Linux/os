# Every boot starts with nothing anchored in /run, so systemd defines each NvPCR's NV index again
# and takes TPM_RC_NV_DEFINED (0x14c) as "already there". tpm2-tss logs that answer as an ERROR of
# its own, three to four lines a boot; systemd reports what does fail in its own words.
[Service]
Environment=TSS2_LOG=esys+none
