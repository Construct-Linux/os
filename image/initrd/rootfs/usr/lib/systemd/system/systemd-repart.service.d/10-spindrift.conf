# systemd-repart in the initrd, made for this root-only image: the table stretched to the disk's end
# first (spindrift-gpt-relocate.service), or there is no room; after /sysroot, by which it finds the
# root's disk; /var's definition from the initrd's own repart.d (by default it reads the root's,
# and the unit's conditions look at the initrd's); and the machine's id as the seed - repart reads
# it from /sysroot/etc/machine-id, which the image leaves empty (systemd.machine_id=firmware gives
# the running system its id), and a random seed would give /var a UUID the dissect_image builtin
# never designates.
# Only while there is no /var: an installed disk has its own, laid by drift install, and nothing
# for repart to make.
[Unit]
ConditionPathExists=!/dev/disk/by-designator/var
Wants=spindrift-gpt-relocate.service
After=spindrift-gpt-relocate.service sysroot.mount

[Service]
ExecStart=
ExecStart=systemd-repart --dry-run=no --seed=%m --definitions=/usr/lib/repart.d
