# What task scan holds the root to. Grype decides it from this.

# The root's os-release says Construct, which Grype knows nothing of; its packages are Wolfi's
# and recipes/'s, and Wolfi's feed says which CVEs of Wolfi's packages are fixed.
distro: wolfi:rolling

# A Critical or High fails the scan only when a version already fixes it: a Wolfi package's by
# rebuilding the root, a recipe's by updating it. One nobody has fixed has nothing to update to;
# it is kept in scan/grype.json under ignoredMatches.
only-fixed: true
fail-on-severity: high

# The pinned Grype; its database is fetched at every scan, its binary never.
check-for-app-update: false

# A Critical or High whose fix is in a library a third party's binary embeds, which only that
# party can rebuild: kept here, listed by the report with what nobody has fixed, until a release
# of theirs built after the fix. Each rule names the file, the vulnerability and the reason.
ignore:
  # vsce-sign, the .NET binary VS Code bundles to check an extension's signature as it installs,
  # embeds System.Security.Cryptography.Pkcs 9.0.5: CVE-2026-84008's quadratic CPU use in
  # SignedCms.CheckSignature over X.509 data the signature carries (2026-10-13, fixed in 9.0.21),
  # and GHSA-2fmv-rv2c-59x7 beside it. Microsoft's @vscode/vsce-sign was last released 2.1.0 on
  # 2026-08-17, so no VS Code fixes it; the exposure is the CPU of a signature check on an
  # extension a person installs. Drop the rules when a VS Code ships a vsce-sign built after
  # 2026-10-13 (strings vsce-sign | grep '^9\.0\.' says its runtime). The rules name the assembly,
  # its version and type, not the file: the watch scans the release's SBOM, which records no
  # location for an assembly a binary embeds, and a rule with one never applied there (issue #17).
  - vulnerability: GHSA-846f-f764-76mx
    reason: "only Microsoft can rebuild VS Code's vsce-sign; no VS Code release carries one built after the fix"
    package:
      name: System.Security.Cryptography.Pkcs
      version: 9.0.5
      type: dotnet
  - vulnerability: GHSA-2fmv-rv2c-59x7
    reason: "only Microsoft can rebuild VS Code's vsce-sign; no VS Code release carries one built after the fix"
    package:
      name: System.Security.Cryptography.Pkcs
      version: 9.0.5
      type: dotnet
